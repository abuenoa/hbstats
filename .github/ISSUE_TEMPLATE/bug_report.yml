name: Bug report / Fallo
description: Something does not work as expected / Algo no funciona como debería
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Puedes escribir en español. Please do not paste players' personal data."
  - type: textarea
    id: what
    attributes:
      label: What happened? / ¿Qué pasó?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Pasos para reproducirlo
      placeholder: "1. Prepare a match… 2. Draw a shot from… 3. …"
  - type: input
    id: device
    attributes:
      label: Device and browser / Dispositivo y navegador
      placeholder: "Samsung Galaxy Tab A 10.1, Chrome 129, installed app"
    validations:
      required: true
  - type: input
    id: club
    attributes:
      label: Club page / Página del club
      placeholder: "https://abuenoa.github.io/hbstats/triana/"
  - type: textarea
    id: screens
    attributes:
      label: Screenshots / Capturas
