name: Idea / Propuesta
description: Suggest a feature or an improvement / Propón una función o una mejora
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Puedes escribir en español. Tell us the situation in the match, not only the solution."
  - type: textarea
    id: need
    attributes:
      label: What do you need during or after the match? / ¿Qué necesitas en el partido o después?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would you like it to work? / ¿Cómo te gustaría que funcionase?
  - type: textarea
    id: today
    attributes:
      label: How do you do it today? / ¿Cómo lo haces hoy? (paper, another app…)
