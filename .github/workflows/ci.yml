name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test suite
        run: python3 tools/run_tests.py
      - name: docs/ matches the sources
        run: |
          python3 tools/build_site.py
          git diff --exit-code -- docs || { echo "::error::docs/ is out of date: run python3 tools/build_site.py and commit it"; exit 1; }
