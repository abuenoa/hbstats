# Development environment: http://localhost:8080 serves src/app.html as you edit it (no accounts, no service worker).
# Start with `docker compose up`, stop with Ctrl+C. Only this computer can reach it.
services:
  app:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app:ro
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: python3 -u tools/dev_server.py --host 0.0.0.0 --out /tmp/site
    ports:
      - "127.0.0.1:8080:8080"
