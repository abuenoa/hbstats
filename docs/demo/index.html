<style>
/* HBStats — Copyright (C) 2026 Antonio Bueno Antón. SPDX-License-Identifier: AGPL-3.0-or-later. Source: https://github.com/abuenoa/hbstats */
/* Layout: one landscape screen — glass scoreboard / [bench | court + floating alerts | goalkeeper, lines, live stats] / glass action strip.
   Triana BM Vivero colours (red, black, gold). Light by default, dark on demand. Shot results share three colours everywhere. */
:root {
  color-scheme: light;
  --bg: #f4f3f0;
  /* Club brand (tools/build_site.py overrides these four per club). Semantic colours (goals, saves…) never change. */
  --brand: #d4202a;
  --brand-rgb: 212, 32, 42;
  --brand-2-rgb: 245, 196, 0;
  --brand-ink: #ffffff;
  --glow-red: rgba(var(--brand-rgb), .10);
  --glow-gold: rgba(var(--brand-2-rgb), .20);
  --surface: #ffffff;
  --soft: #f1efec;
  --btn: rgba(255, 255, 255, .72);
  --glass: rgba(255, 255, 255, .62);
  --glass-strong: rgba(255, 255, 255, .84);
  --glass-edge: rgba(255, 255, 255, .75);
  --line: rgba(20, 20, 20, .09);
  --fg: #151515;
  --muted: #5f5b57;
  --faint: #a8a39e;
  --shadow: 0 1px 0 rgba(255, 255, 255, .9) inset, 0 10px 30px rgba(40, 20, 10, .08);
  --pop-shadow: 0 1px 0 #fff inset, 0 24px 60px rgba(40, 20, 10, .22);

  --red: #d4202a;
  --red-deep: #a3141c;
  --gold: #f5c400;
  --crown-light: #fff3a6;
  --crown-deep: #b8860b;
  --crown-band-deep: #8a6400;
  --crown-edge: #7a5500;
  --crown-shine: #fffbe0;
  --black: #151515;
  --on-color: #ffffff;

  --court: #e8ecf0;
  --area: #fde8a3;
  --court-line: #1d1d1f;
  --goal-face: #ffffff;
  --goal-hot: #fff4cc;
  --goal-sector: #ffd84d;
  --net: #d5d9de;

  /* Shot results: the same three colours on the court, popups, stats and timeline */
  --gol: #1f9d55;
  --parada: #2563eb;
  --fallo: #8a8f98;
  /* Other action groups */
  --ataque: #7c3aed;
  --defensa: #0e9f9a;
  --error: #e4572e;
  --amarilla: #f5c400;
  --dos: #f08a1c;
  --desc: #dc2626;
  --azul: #0ea5e9;
  /* Our actions: good in attack green, good in defence blue, bad red, rule breaches orange, forced by the rival purple */
  --act-good: #1f9d55;
  --act-def: #2563eb;
  --act-bad: #d4202a;
  --act-rule: #f08a1c;
  --act-rival: #7c3aed;

  --ext: #14b8a6;
  --lat: #8b5cf6;
  --cen: #ec4899;
  --piv: #f5b400;
  --por: #151515;

  --good: #1f9d55;
  --warn: #c98a00;
  --bad: #d4202a;

  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 18px;
  --tap: 56px;
  --spring: cubic-bezier(.2, .9, .25, 1);

  /* Design tokens (outside the live screen, which keeps reading the properties above). Dark values sit in both dark blocks. */
  --color-bg-page: var(--bg);
  --color-bg-surface: var(--surface);
  --color-bg-subtle: var(--soft);
  --color-border: var(--line);
  --color-text: var(--fg);
  --color-text-secondary: var(--muted);
  --color-text-tertiary: #75706b;
  --color-accent: var(--brand);
  --color-on-accent: var(--brand-ink);
  --type-display: 600 2.25rem/1.1 var(--font-body);
  --type-title: 600 1.5rem/1.2 var(--font-body);
  --type-heading: 600 1.125rem/1.3 var(--font-body);
  --type-body: 400 1rem/1.5 var(--font-body);
  --type-caption: 400 0.8125rem/1.4 var(--font-body);
  --type-kpi: 800 2.125rem/1.05 var(--font-display);
  --dorsal-ink: #ffffff;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px; --radius-full: 9999px;
  --ring: 0 0 0 1px rgba(0, 0, 0, .06), 0 1px 2px -1px rgba(0, 0, 0, .06), 0 2px 4px 0 rgba(0, 0, 0, .04);
  --ring-hover: 0 0 0 1px rgba(0, 0, 0, .08), 0 1px 2px -1px rgba(0, 0, 0, .08), 0 2px 4px 0 rgba(0, 0, 0, .06);
  --photo-outline: rgba(0, 0, 0, .1);
  --dur-press: 150ms; --dur-state: 200ms; --dur-enter: 300ms; --dur-exit: 150ms;
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
  --focus-ring: 2px solid var(--parada);
  --target: 44px;
  --color-success: var(--rating-good); --color-on-success: var(--rating-ink-good);
  --color-success-text: #15803d; --color-warning-text: #8a5a00; --color-danger-text: #b91c1c;
  --poster-tint: 14%;
  --color-keeper: var(--por);
  --rate-tint: 30%;
  /* Rating bands: the fill and the ink of the numerals on it */
  --rating-top: #1d4ed8; --rating-ink-top: #ffffff;
  --rating-good: #15803d; --rating-ink-good: #ffffff;
  --rating-mid: #bf8003; --rating-ink-mid: #151515;
  --rating-low: #c2410c; --rating-ink-low: #ffffff;
  --rating-bad: #991b1b; --rating-ink-bad: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e0e10; --glow-red: rgba(var(--brand-rgb), .20); --glow-gold: rgba(var(--brand-2-rgb), .08);
    --surface: #18181b; --soft: #232327; --btn: rgba(255, 255, 255, .07);
    --glass: rgba(26, 26, 30, .62); --glass-strong: rgba(30, 30, 34, .86); --glass-edge: rgba(255, 255, 255, .09);
    --line: rgba(255, 255, 255, .10); --fg: #f2f1ef; --muted: #aca6a0; --faint: #6d6863;
    --shadow: 0 1px 0 rgba(255, 255, 255, .06) inset, 0 10px 30px rgba(0, 0, 0, .4);
    --pop-shadow: 0 1px 0 rgba(255, 255, 255, .08) inset, 0 24px 60px rgba(0, 0, 0, .6);
    --black: #f2f1ef; --por: #2a2a2e;
    --court: #1d242b; --area: #3b3215; --court-line: #e6e6e6; --goal-face: #121417; --goal-hot: #2e2a14; --goal-sector: #7a6412; --net: #2c3238;
    --parada: #4f8bff; --fallo: #7d838c; --gol: #2fbf71; --ataque: #9461ff;
    --act-good: #2fbf71; --act-def: #4f8bff; --act-bad: #ef4444; --act-rival: #9461ff;
    --color-text-tertiary: #928d88;
    --color-success-text: #2fbf71; --color-warning-text: #f08a1c; --color-danger-text: #ef4444; --color-keeper: #71717a; --rate-tint: 45%;
    --ring: 0 0 0 1px rgba(255, 255, 255, .08); --ring-hover: 0 0 0 1px rgba(255, 255, 255, .13); --photo-outline: rgba(255, 255, 255, .1);
    --rating-top: #5b8cff; --rating-ink-top: #0e0e10; --rating-good: #2fbf71; --rating-ink-good: #0e0e10; --rating-mid: #f5c542; --rating-ink-mid: #0e0e10;
    --rating-low: #ea7a2e; --rating-ink-low: #0e0e10; --rating-bad: #c53030; --rating-ink-bad: #ffffff;
    --dorsal-ink: #0e0e10;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e0e10; --glow-red: rgba(var(--brand-rgb), .20); --glow-gold: rgba(var(--brand-2-rgb), .08);
  --surface: #18181b; --soft: #232327; --btn: rgba(255, 255, 255, .07);
  --glass: rgba(26, 26, 30, .62); --glass-strong: rgba(30, 30, 34, .86); --glass-edge: rgba(255, 255, 255, .09);
  --line: rgba(255, 255, 255, .10); --fg: #f2f1ef; --muted: #aca6a0; --faint: #6d6863;
  --shadow: 0 1px 0 rgba(255, 255, 255, .06) inset, 0 10px 30px rgba(0, 0, 0, .4);
  --pop-shadow: 0 1px 0 rgba(255, 255, 255, .08) inset, 0 24px 60px rgba(0, 0, 0, .6);
  --black: #f2f1ef; --por: #2a2a2e;
  --court: #1d242b; --area: #3b3215; --court-line: #e6e6e6; --goal-face: #121417; --goal-hot: #2e2a14; --goal-sector: #7a6412; --net: #2c3238;
  --parada: #4f8bff; --fallo: #7d838c; --gol: #2fbf71; --ataque: #9461ff;
    --act-good: #2fbf71; --act-def: #4f8bff; --act-bad: #ef4444; --act-rival: #9461ff;
  --color-text-tertiary: #928d88;
  --color-success-text: #2fbf71; --color-warning-text: #f08a1c; --color-danger-text: #ef4444; --color-keeper: #71717a; --rate-tint: 45%;
  --ring: 0 0 0 1px rgba(255, 255, 255, .08); --ring-hover: 0 0 0 1px rgba(255, 255, 255, .13); --photo-outline: rgba(255, 255, 255, .1);
  --rating-top: #5b8cff; --rating-ink-top: #0e0e10; --rating-good: #2fbf71; --rating-ink-good: #0e0e10; --rating-mid: #f5c542; --rating-ink-mid: #0e0e10;
  --rating-low: #ea7a2e; --rating-ink-low: #0e0e10; --rating-bad: #c53030; --rating-ink-bad: #ffffff;
  --dorsal-ink: #0e0e10;
}

/* Type roles for pages outside the live screen */
.t-display { font: var(--type-display); }
.t-title { font: var(--type-title); }
.t-heading { font: var(--type-heading); }
.t-body { font: var(--type-body); }
.t-caption { font: var(--type-caption); }
.num { font-variant-numeric: tabular-nums; }

html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(900px 500px at 8% -10%, var(--glow-red), transparent 60%),
    radial-gradient(800px 500px at 100% 110%, var(--glow-gold), transparent 60%),
    var(--bg);
  color: var(--fg);
  font: 15px/1.4 var(--font-body);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-appearance: none; appearance: none; }
button:focus-visible { outline: 3px solid var(--parada); outline-offset: 2px; }
button:disabled { opacity: .35; cursor: default; }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--glass-edge);
  box-shadow: var(--shadow);
}
.press { transition: transform 100ms ease-out; }
.press:active:not(:disabled) { transform: scale(.97); }

.app {
  height: 100%; box-sizing: border-box; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 10px; padding-block: 10px; padding-inline: 16px;
}

/* ---------- Scoreboard ---------- */
/* Each team's controls on its own side (ours left, rival right); score and clock centred */
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; border-radius: var(--radius); padding: 8px 12px; }
.crest { width: 44px; height: 44px; flex: none; border-radius: 50%; }
.side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.side.them { justify-content: flex-end; }
/* Only the team name gives way when 2' counters crowd the bar; buttons and counters keep their size */
.side > .btn, .side > .rex { flex: none; }
/* Running 2' counters stack two high, so several fit beside the buttons at the height of one */
.side > .rex { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, auto); gap: 3px 4px; }
.side > .rex:has(> :only-child) { grid-template-rows: auto; }
.side > .rex .rex-chip { font-size: 14px; padding: 2px 6px; border-radius: 6px; line-height: 1.15; }
.rex-chip small { font-size: inherit; margin-left: 4px; }
.side .name { font-family: var(--font-display); font-weight: 800; font-size: 21px; text-transform: uppercase; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side .name.them { color: var(--muted); }
.center { display: flex; align-items: center; gap: 10px; }
.score { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: center; letter-spacing: -.02em; }
.score.us { color: var(--brand); }
button.score { border: 0; background: transparent; padding: 0 4px; border-radius: 10px; }
.rex { display: flex; gap: 6px; align-items: center; }
.rex-chip { font-family: var(--font-display); font-weight: 800; font-size: 17px; padding: 2px 8px; border-radius: 8px; background: var(--dos); color: #fff; font-variant-numeric: tabular-nums; }
button.rex-chip { border: 0; cursor: pointer; position: relative; }
/* The × says a tap ends the 2' now: on hover with a mouse, always on touch screens */
.rex-chip .x { position: absolute; top: -8px; right: -8px; width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; font: 700 15px/1 system-ui, sans-serif; z-index: 1; background: var(--fg); color: var(--surface); opacity: 0; transition: opacity .12s; pointer-events: none; }
.rex-chip:hover .x, .rex-chip:focus-visible .x { opacity: 1; }
@media (hover: none) {
  .side > .rex .rex-chip { padding-right: 22px; }
  .rex-chip .x { opacity: .8; top: 50%; right: 3px; width: 15px; height: 15px; font-size: 12px; transform: translateY(-50%); background: rgba(0, 0, 0, .28); color: #fff; }
}
.rpick:disabled { opacity: .35; }
.rex-chip.num { background: var(--soft); color: var(--fg); }
.rex-chip.num.up { background: var(--good); color: #fff; }
.rex-chip.num.down { background: var(--bad); color: #fff; }
.dash { font-family: var(--font-display); font-size: 30px; color: var(--faint); }
.clock { display: flex; align-items: center; gap: 8px; }
.clock-face {
  display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 116px; min-height: 52px;
  border-radius: 14px; border: 1px solid var(--line); background: var(--surface); padding: 2px 12px;
}
.clock-face .period { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.clock-face .time { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.clock-face .time.paused { color: var(--red); }
.btn {
  min-height: 48px; min-width: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--btn); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.icon { padding: 0; font-size: 20px; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: 0 1px 0 rgba(255, 255, 255, .3) inset, 0 6px 16px rgba(var(--brand-rgb), .3); }
.btn.go { background: var(--gol); color: #fff; border-color: transparent; box-shadow: 0 1px 0 rgba(255, 255, 255, .3) inset, 0 6px 16px rgba(31, 157, 85, .3); }
.btn.play { min-width: 104px; font-weight: 700; }
/* Armed (second tap deletes): outlined danger, never filled, so it never looks like a brand-coloured primary button. */
.btn.armed { background: var(--surface); color: var(--desc); border: 2px solid var(--desc); box-shadow: 0 0 0 3px rgba(220, 38, 38, .18); }
.tm-dots { display: inline-flex; gap: 4px; }
.tm-dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--brand); display: block; }
.tm-dots i.used { background: var(--brand); }

/* ---------- Columns ---------- */
.main { display: grid; grid-template-columns: 172px minmax(0, 1fr) 292px; gap: 10px; min-height: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 6px 20px rgba(40, 20, 10, .05); min-height: 0; display: flex; flex-direction: column; }
.panel h2 { margin: 0; padding: 8px 14px 3px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.scroll { overflow-y: auto; min-height: 0; }

.bench { padding: 2px 8px 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; touch-action: pan-y; }
.bench > .empty { grid-column: 1 / -1; }
.bench.drop { outline: 3px dashed var(--defensa); outline-offset: -4px; border-radius: var(--radius); }
.bench-player {
  display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; padding: 6px 4px 4px;
  background: var(--soft); border: 1px solid var(--line); border-radius: 14px; touch-action: none;
}
.bench-player .disc { width: 38px; height: 38px; font-size: 18px; }
/* ⇄: on court in one phase only (the attack-defence change) */
.bench-player { position: relative; }
.bench-player .ad-mark { position: absolute; top: 2px; left: 5px; font-style: normal; font-size: 18px; font-weight: 800; line-height: 1; }
.tok .ad-mark circle { fill: var(--surface); stroke: var(--fg); stroke-width: 3; }
.tok .ad-mark text { font-size: 32px; font-weight: 800; fill: var(--fg); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.bench-player .who { width: 100%; text-align: center; }
.bench-player .who b { font-size: 12px; }
.disc {
  width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 21px; color: #fff; box-shadow: 0 0 0 3px var(--surface), 0 2px 6px rgba(0, 0, 0, .18);
}
.disc.light-text { color: #151515; }
/* With a photo the face fills the circle and the dorsal sits on a small badge in the position colour */
.disc.photo { position: relative; }
.disc.photo b { position: absolute; right: -6px; bottom: -4px; min-width: 20px; padding: 0 3px; border-radius: 10px; font-size: 12px; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px var(--surface); }
.disc.photo b.light-text { color: #151515; }
.bench-player.out { opacity: .45; text-decoration: line-through; }
.bench-player.out .who b { color: var(--desc); }
.who { min-width: 0; }
.who b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { color: var(--muted); font-size: 12px; }
.legend { padding: 8px 12px 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: block; border: 1px solid var(--line); }
/* Quick note: fills the free space at the bottom of the bench panel. */
.note-box { margin-top: auto; padding: 8px 10px 10px; display: grid; gap: 6px; border-top: 1px solid var(--line); }
.note-box textarea { resize: none; min-height: 0; font: inherit; font-size: 14px; -webkit-user-select: text; user-select: text; }
.ev span { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
.empty { color: var(--muted); font-size: 13px; padding: 4px 6px; margin: 0; }

.stage { position: relative; padding: 6px; overflow: hidden; transition: border-color .2s ease-out, box-shadow .2s ease-out; }
.stage[data-phase="DEF"] { border-color: var(--defensa); box-shadow: 0 0 0 2px var(--defensa); }
.stage[data-phase="ATK"] { border-color: var(--ataque); box-shadow: 0 0 0 2px var(--ataque); }
.phase { position: absolute; top: 12px; left: 12px; z-index: 7; display: flex; align-items: center; gap: 6px; padding: 4px; border-radius: 18px; }
.phase .seg-btn {
  min-height: 48px; min-width: 112px; border: 0; border-radius: 14px; background: transparent;
  font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .02em; color: var(--muted);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.phase .seg-btn[data-phase="DEF"][aria-pressed="true"] { background: var(--defensa); color: #fff; }
.phase .seg-btn[data-phase="ATK"][aria-pressed="true"] { background: var(--ataque); color: #fff; }
.phase .auto { min-height: 36px; padding: 0 10px; border-radius: 12px; border: 1px solid var(--line); background: transparent; font-size: 12px; font-weight: 700; color: var(--muted); }
.phase .auto[aria-pressed="true"] { color: var(--fg); background: var(--soft); }
.stage svg { width: 100%; height: 100%; display: block; touch-action: none; }
.sample-tag {
  position: absolute; bottom: 12px; left: 12px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--brand); border: 1px solid var(--brand); border-radius: 8px; padding: 3px 8px; pointer-events: none; background: var(--surface);
}
.hint {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5;
  border-radius: 22px; padding: 8px 16px; font-size: 14px; font-weight: 600; pointer-events: none;
  white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis;
}
.armed-bar {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 7;
  display: flex; align-items: center; gap: 10px; border-radius: 30px; padding: 6px 6px 6px 8px;
  border-color: var(--gol); animation: enter .22s var(--spring);
}
.armed-bar .disc { width: 38px; height: 38px; font-size: 18px; }
/* A penalty can stay pending a while: its bar sits below the phase toggle so the toggle stays reachable. */
.armed-bar.penalty { top: 76px; border-color: var(--gold); }
.armed-bar b { font-size: 15px; white-space: nowrap; }
.armed-bar .btn { min-height: 40px; min-width: 40px; border-radius: 20px; padding: 0; }

/* Court SVG */
.tok { cursor: grab; }
.tok .body { stroke: var(--surface); stroke-width: 5; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .25)); }
.tok .num { font-family: var(--font-display); font-weight: 800; font-size: 34px; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.tok .num.dark { fill: #151515; }
.tok .num.badge { font-size: 22px; }
.tok .num-badge { stroke: var(--surface); stroke-width: 3; }
.tok .nm-bg { fill: var(--surface); stroke: var(--line); opacity: .94; }
.tok .nm { font-family: var(--font-body); font-weight: 600; font-size: 19px; fill: var(--fg); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.tok.excluded { opacity: .45; }
.tok .ex-bg { fill: var(--dos); }
.tok .ex-t { font-family: var(--font-display); font-weight: 800; font-size: 21px; fill: #fff; text-anchor: middle; dominant-baseline: central; }
.tok.gk .body { stroke: var(--gold); }
/* The drawn shot shows whose it is: ours in attack, the rival's in defence */
#stage[data-phase="ATK"] #draw-line { stroke: var(--gol); } #stage[data-phase="ATK"] #draw-origin { fill: var(--gol); }
#stage[data-phase="DEF"] #draw-line { stroke: var(--red); } #stage[data-phase="DEF"] #draw-origin { fill: var(--red); }
.tok.shooter .body { stroke: var(--gol); stroke-width: 8; }
.court-label { font-family: var(--font-display); font-weight: 700; font-size: 21px; fill: var(--court-line); opacity: .4; }
.chart-num { font-family: var(--font-display); font-weight: 800; fill: var(--fg); }
.chart-cap { font-size: 13px; font-weight: 700; fill: var(--muted); }
.radar .chart-cap { font-size: 18px; }
.zone-pct, .goal-pct { font-family: var(--font-display); font-weight: 800; }
.zone-pct { font-size: 34px; fill: var(--fg); }
.zone-n { font-size: 22px; font-weight: 700; fill: var(--fg); }
.home .zone-pct, .home .zone-n, #sheet .zone-pct, #sheet .zone-n, .home .court-label, #sheet .court-label { stroke: var(--surface); stroke-width: 6px; stroke-linejoin: round; paint-order: stroke; }
.goal-pct, .goal-n { fill: var(--fg); }
.goal-cell:not([fill*="--soft"]) { fill-opacity: var(--rate-tint); }
.goal-pct { font-size: 28px; }
.goal-n { font-size: 13px; font-weight: 700; }
.zone-dot { stroke: var(--surface); stroke-width: 2; }
.tally-label { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .08em; fill: var(--muted); text-anchor: end; }
.tally-owner { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: .1em; fill: var(--red); text-anchor: end; }
.tally-num { font-family: var(--font-display); font-weight: 800; font-size: 52px; text-anchor: end; }
.goal-face { transition: fill 120ms ease-out; }
.goal-face.hot { fill: var(--goal-hot); }
/* While aiming: the whole goal lights up, the third under the pen a stronger yellow, the frame gold when the shot would hit it */
.goal-sector { fill: var(--goal-sector); pointer-events: none; }
.penalty-spot { fill: var(--gold); opacity: .85; pointer-events: none; }
/* Actions panel: the armed action's possible receivers glow gold. */
.panel-acts { display: flex; flex-direction: column; gap: 8px; margin: 8px 10px 0; }
.panel-acts .acts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.panel-acts .act[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--fg); }
.panel-acts .arm-note { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.panel-section { display: flex; flex-direction: column; gap: 6px; }
.panel-section .type-row { display: flex; flex-direction: column; gap: 3px; }
.panel-section .type-row > span { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.panel-acts .acts.types { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.panel-acts .acts.types .act { min-height: 44px; font-size: 13px; padding: 0 4px; }
.panel-acts .acts:not(.types) .act { font-size: 16px; }
.tok.target .body { stroke: var(--gold); stroke-width: 10; }
.bench-player.target .disc, .gk-card.target { box-shadow: 0 0 0 4px var(--gold); }
.goal-frame-hot { fill: none; stroke: var(--gold); stroke-width: 22; stroke-linejoin: round; pointer-events: none; filter: drop-shadow(0 0 6px var(--gold)); }
.zone-tag { font-family: var(--font-display); font-weight: 800; font-size: 38px; fill: var(--fg); stroke: var(--surface); stroke-width: 8; paint-order: stroke; text-anchor: middle; }

/* Floating alerts */
.alerts { position: absolute; top: 10px; right: 10px; width: min(300px, calc(100% - 20px)); display: flex; flex-direction: column; gap: 8px; z-index: 6; max-height: calc(100% - 20px); overflow-y: auto; }
.alert { border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; border-left: 6px solid var(--parada); animation: enter .26s var(--spring); }
.alert.k-exclusion { border-left-color: var(--dos); }
.alert.k-period, .alert.k-timeout { border-left-color: var(--gold); }
.alert.k-desc { border-left-color: var(--desc); }
.alert.ringing { animation: enter .26s var(--spring), ring .9s ease-in-out .3s 3; }
.alert .t { font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1.1; }
.alert p { margin: 0; font-size: 13px; color: var(--muted); }
.alert .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.alert .btn { min-height: 44px; flex: 1; }
.stepper { display: flex; align-items: center; gap: 6px; width: 100%; }
.stepper small { flex: 1; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 22px; font-weight: 700; }
.stepper output { font-family: var(--font-display); font-weight: 800; font-size: 30px; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }

/* ---------- Right column ---------- */
.gk-card { margin: 8px 10px 0; width: calc(100% - 20px); box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--soft); text-align: left; }
.gk-card .disc { background: var(--por); color: #fff; box-shadow: 0 0 0 3px var(--gold); }
.gk-card .pct { margin-left: auto; text-align: right; }
.gk-card .disc { width: 38px; height: 38px; font-size: 18px; }
.gk-card .pct strong { display: block; font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.gk-card .pct small { font-size: 11px; color: var(--muted); }
.seg { display: flex; margin: 6px 10px 0; padding: 3px; gap: 3px; background: var(--soft); border-radius: 12px; }
.seg button { flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: transparent; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
.team-seg button { min-height: 42px; padding: 0 6px; min-width: 0; }
.team-seg [data-panel-mode] b { font-size: 12px; }
.team-seg b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 14px; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team-seg [data-source="US"][aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.team-seg [data-source="GK"][aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.lines { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 10px 8px; }
.line-chip { min-height: 40px; border-radius: 12px; border: 2px solid var(--line); background: transparent; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.line-chip i { width: 18px; height: 4px; border-radius: 2px; display: block; }
.line-chip[aria-pressed="true"] { border-color: currentColor; background: var(--soft); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 10px; }
.kpi { background: var(--soft); border-radius: 12px; padding: 6px 4px; text-align: center; min-width: 0; }
.kpi strong { display: block; font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi span { display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.kpi small { display: block; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.r-good { color: var(--good); } .r-warn { color: var(--warn); } .r-bad { color: var(--bad); } .r-none { color: var(--faint); }
.zones { padding: 0 12px 2px; display: grid; gap: 4px; }
.zone { display: grid; grid-template-columns: 50px 1fr 34px 42px; gap: 8px; align-items: center; font-size: 13px; }
.zone .n { text-align: right; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.zone b { font-family: var(--font-display); font-weight: 800; font-size: 17px; white-space: nowrap; }
.zone .track { height: 12px; border-radius: 6px; background: var(--soft); overflow: hidden; display: flex; }
.zone .track span { height: 100%; transition: width .4s var(--spring); }
.zone .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; }
.facts { padding: 4px 10px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 12px; }
.fact { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 4px 2px; border-bottom: 1px solid var(--line); min-width: 0; }
.fact b { white-space: nowrap; }
.fact span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fact span { color: var(--muted); }
.fact b { font-variant-numeric: tabular-nums; }

/* ---------- Action strip ---------- */
.strip { display: flex; gap: 10px; align-items: stretch; min-width: 0; border-radius: var(--radius); padding: 8px; }
.events { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; }
.ev {
  flex: none; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px 0 10px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); font-size: 13px; white-space: nowrap;
}
.ev i { width: 10px; height: 10px; border-radius: 50%; display: block; flex: none; }
.ev time { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ev.fresh { animation: flash 1.4s ease-out; }
.strip-actions { display: flex; gap: 8px; flex: none; }
/* Leaving the match: first in the strip and dark, so it reads apart from the match actions. */
.btn.back { flex: none; background: var(--fg); color: var(--bg); border-color: transparent; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--gold); } to { box-shadow: 0 0 0 0 transparent; } }
@keyframes enter { from { transform: scale(.95); opacity: 0; filter: blur(6px); } to { transform: none; opacity: 1; filter: none; } }
@keyframes ring { 0%, 100% { transform: none; } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* ---------- Popups ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .06); }
.pop {
  position: fixed; z-index: 21; width: 380px; max-width: calc(100vw - 32px); box-sizing: border-box;
  border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
  background: var(--glass-strong); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid var(--glass-edge); box-shadow: var(--pop-shadow);
  animation: enter .22s var(--spring);
}
.pop header { display: flex; align-items: center; gap: 10px; }
.pop header .disc { width: 42px; height: 42px; font-size: 19px; }
.pop header b { display: block; font-size: 17px; }
.pop header small { color: var(--muted); font-size: 12px; }
.pop .zone-big { margin-left: auto; font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; padding: 4px 12px; border-radius: 12px; background: var(--soft); }
.pop h3, .panel-section h3 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.group { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; }
.group > span { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.group .acts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.group .acts > :last-child:nth-child(odd) { grid-column: 1 / -1; }
.group .acts.row { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 1fr; }
.act {
  min-height: var(--tap); border-radius: 14px; border: 0; font-weight: 700; font-size: 15px; line-height: 1.1;
  display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 0 8px; color: #fff;
  box-shadow: 0 1px 0 rgba(255, 255, 255, .3) inset, 0 2px 6px rgba(0, 0, 0, .12);
  transition: transform 100ms ease-out;
}
.act:active { transform: scale(.96); }
.act.big { min-height: 64px; font-size: 18px; }
.c-gol { background: var(--gol); } .c-parada { background: var(--parada); } .c-fallo { background: var(--fallo); }
.c-error { background: var(--error); }
.c-amarilla { background: var(--amarilla); color: #151515; } .c-dos { background: var(--dos); } .c-desc { background: var(--desc); } .c-azul { background: var(--azul); }
/* Sanctions: a card-shaped icon in the card's colour so each one reads at a glance */
.act.card-btn { background: var(--surface); color: var(--fg); border: 1px solid var(--line); box-shadow: none; flex-direction: column; gap: 3px; min-height: 66px; font-size: 12px; padding: 4px; }
.card-ico { width: 24px; height: 32px; border-radius: 4px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 15px; font-style: normal; color: #fff; transform: rotate(-8deg); box-shadow: 0 2px 5px rgba(0, 0, 0, .25); }
.card-ico.dark-text { color: #151515; }
.card-ico.mini { width: 12px; height: 16px; border-radius: 2px; font-size: 8px; transform: none; box-shadow: none; }
.act.card-btn[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 3px var(--fg); }
.rpick .marks { display: flex; gap: 2px; }
.rpick.sent-off { opacity: .5; }
.note { color: var(--muted); font-size: 12px; margin: 0; }
.c-act-good { background: var(--act-good); } .c-act-def { background: var(--act-def); } .c-act-bad { background: var(--act-bad); } .c-act-rule { background: var(--act-rule); } .c-act-rival { background: var(--act-rival); }
.t-act-good { color: var(--act-good); } .t-act-def { color: var(--act-def); } .t-act-bad { color: var(--act-bad); } .t-act-rule { color: var(--act-rule); } .t-act-rival { color: var(--act-rival); }
.c-neutral { background: var(--surface); color: var(--fg); border: 1px solid var(--line); box-shadow: none; }
.c-dark { background: #151515; }
.t-gol { color: var(--gol); } .t-parada { color: var(--parada); } .t-fallo { color: var(--fallo); }
.t-sancion { color: var(--dos); }
.act-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.act-grid.two { grid-template-columns: repeat(2, 1fr); }
.chip { min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.pop.wide { width: 560px; }
.rival-picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
.rival-picks.named { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
.rpick { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; min-width: 0; padding: 0 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.rival-picks.named .rpick { justify-content: flex-start; }
.rpick .disc { width: 34px; height: 34px; font-size: 16px; }
.rpick span { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rpick[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 3px var(--fg); }
/* Rival shot: who shot is the hard part to log, so the dorsals are the big targets and the results stay small */
.rival-picks.shooter { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.rival-picks.shooter.named { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); }
.rival-picks.shooter .rpick { min-height: 72px; }
.rival-picks.shooter .rpick .disc { width: 50px; height: 50px; font-size: 24px; }
.rival-picks.shooter .rpick span { font-size: 15px; }
/* Shooter picker: court players first (bigger), bench on the right */
.picker { display: grid; grid-template-columns: 3fr 2fr; gap: 10px; }
.picker > div { display: grid; gap: 6px; align-content: start; min-width: 0; }
.picker .picks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.pick { display: flex; align-items: center; gap: 8px; min-height: 48px; min-width: 0; padding: 0 10px 0 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 600; font-size: 14px; text-align: left; }
.pick span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick[aria-pressed="true"] { border-color: var(--gol); box-shadow: 0 0 0 3px var(--gol); }
.picker .bench-picks .pick { min-height: 40px; font-size: 12px; }
.picker .bench-picks .disc { width: 28px; height: 28px; font-size: 13px; }
.act:disabled { opacity: .35; }
.back { align-self: flex-start; min-height: 40px; border: 0; background: transparent; color: var(--muted); font-weight: 700; padding: 0 4px; }
.clock-set { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin: 0; }
.time-in { font-family: var(--font-display); font-weight: 800; font-size: 26px; text-align: center; font-variant-numeric: tabular-nums; }
.big-time { font-family: var(--font-display); font-weight: 800; font-size: 56px; text-align: center; line-height: 1; font-variant-numeric: tabular-nums; }

/* ---------- Sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow: auto; padding-block: 16px; padding-inline: 16px; }
.final { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .35); overflow: auto; }
.final-card { width: min(860px, 100%); box-sizing: border-box; border-radius: var(--radius-xl); padding: var(--space-5); display: grid; gap: var(--space-4); background: var(--glass-strong); border: 1px solid var(--glass-edge); box-shadow: var(--pop-shadow); }
.final-card h2 { margin: 0; font: var(--type-title); text-wrap: balance; }
.final-card td:first-child { text-align: left; font-weight: 600; }
/* Summary KPIs: our value (coloured against theirs) beside the rival's, details folded underneath */
.kpi-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2); }
.kpi-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--inner-radius, var(--radius-sm)); padding: var(--space-3); min-width: 0; }
.kpi-tile > span { font: var(--type-caption); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.kpi-tile .vs { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin-top: var(--space-1); }
.kpi-tile .vs > div { min-width: 0; }
.kpi-tile strong { display: block; font: var(--type-kpi); font-variant-numeric: tabular-nums; }
.kpi-tile .them strong { color: var(--muted); }
.kpi-tile small { display: block; font: var(--type-caption); color: var(--muted); overflow-wrap: anywhere; }
.more summary { min-height: 44px; display: flex; align-items: center; font-weight: 700; cursor: pointer; }
.halftime-points { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.halftime-points .acta-h { margin-top: 0; }
@media (max-width: 700px) { .kpi-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .halftime-points { grid-template-columns: 1fr; } }
.mvp-pick { display: grid; gap: var(--space-2); }
.mvp-pick h3 { margin: 0; font: var(--type-caption); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.mvp-faces { display: flex; flex-wrap: wrap; gap: var(--space-4) var(--space-3); padding-top: var(--space-6); }
.mvp-face { position: relative; display: grid; justify-items: center; gap: 4px; min-width: var(--tap); min-height: var(--tap); padding: 4px 6px; border: 2px solid transparent; border-radius: var(--radius-md); background: transparent; color: var(--fg); font: var(--type-caption); font-weight: 600; }
.mvp-face[aria-pressed="true"] { border-color: var(--gold); background: var(--glow-gold); }
.crown-face { position: absolute; left: -6px; top: -22px; width: 38px; height: auto; transform: rotate(-34deg); pointer-events: none; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .5)); }
.final-mail { display: grid; gap: var(--space-1); font: var(--type-caption); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.sheet-head { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-3); }

/* ---------- Design system: photo outline, press, hover and focus (home, «Hoja» and final; the live screen keeps its own) ---------- */
.home .disc.photo, #sheet .disc.photo, #final .disc.photo { outline: 1px solid var(--photo-outline); outline-offset: -1px; }
.home .press:active:not(:disabled), #sheet .press:active:not(:disabled), #final .press:active:not(:disabled) { transform: none; }
@media (prefers-reduced-motion: no-preference) {
  .home .press, #sheet .press, #final .press { transition: transform var(--dur-press) var(--ease-out); }
  .home .press:active:not(:disabled), #sheet .press:active:not(:disabled), #final .press:active:not(:disabled) { transform: scale(.96); }
}
@media (hover: hover) {
  .home .row-link:hover { background: var(--color-bg-subtle); }
  .home .team-card:hover, .home .face:hover { box-shadow: var(--ring-hover); }
  .home .leader:hover, .home .cal-result:hover { background: var(--color-bg-subtle); }
}

<body>

<div class="app">
  <header class="bar glass" aria-label="Marcador">
    <div class="side us">
      <img class="crest" id="bar-crest" alt="" src="">
      <span class="name" id="name-us"></span>
      <button class="btn press" id="btn-tm-us" type="button" aria-label="Tiempo muerto nuestro">TM <span class="tm-dots" id="tm-dots-us"></span></button>
      <button class="btn press" id="btn-us-2m" type="button" aria-label="Sanción a un jugador nuestro: 2', amarilla, roja o azul">2'</button>
      <span class="rex" id="uex" aria-live="polite"></span>
    </div>
    <div class="center">
      <button class="score us press" id="score-us" type="button" aria-label="Corregir marcador">0</button>
      <span class="dash">–</span>
      <button class="score press" id="score-them" type="button" aria-label="Corregir marcador">0</button>
      <div class="clock">
        <button class="clock-face press" id="clock-face" type="button" aria-label="Reloj: parar, ajustar o cambiar de parte">
          <span class="period" id="period">1ª parte</span>
          <span class="time paused" id="clock">00:00</span>
        </button>
        <button class="btn play go press" id="btn-play" type="button">▶ Iniciar</button>
      </div>
    </div>
    <div class="side them">
      <span class="rex" id="rex" aria-live="polite"></span>
      <button class="btn press" id="btn-rival-2m" type="button" aria-label="Sanción al rival: 2', amarilla, roja o azul">2'</button>
      <button class="btn press" id="btn-tm-them" type="button" aria-label="Tiempo muerto del rival">TM <span class="tm-dots" id="tm-dots-them"></span></button>
      <span class="name them" id="name-them">Rival</span>
    </div>
  </header>

  <div class="main">
    <aside class="panel" aria-label="Banquillo">
      <h2>Banquillo</h2>
      <div class="scroll"><div class="bench" id="bench"></div></div>
      <div class="legend">
        <span><i style="background:var(--ext)"></i>Extremo</span>
        <span><i style="background:var(--lat)"></i>Lateral</span>
        <span><i style="background:var(--cen)"></i>Central</span>
        <span><i style="background:var(--piv)"></i>Pivote</span>
      </div>
      <form class="note-box" id="note-form">
        <textarea class="in" id="note-text" rows="3" maxlength="140" placeholder="Nota rápida…" aria-label="Nota rápida del partido (se guarda con el minuto)"></textarea>
        <button class="btn press" type="submit">Anotar</button>
      </form>
    </aside>

    <section class="panel stage" id="stage" aria-label="Pista">
      <svg id="court" viewBox="0 0 1000 880" preserveAspectRatio="xMidYMid meet" role="application" aria-label="Media pista: arrastra hasta la portería para registrar un lanzamiento">
        <g id="court-floor"></g>
        <rect id="penalty-spot" class="penalty-spot" x="440" y="595" width="120" height="30" rx="15" visibility="hidden"/>
        <rect id="goal-face" class="goal-face" x="320" y="20" width="360" height="240" fill="var(--goal-face)"/>
        <rect id="goal-sector" class="goal-sector" width="120" height="80" visibility="hidden"/>
        <g id="goal-net"></g>
        <path id="goal-frame-hot" class="goal-frame-hot" d="M 320 260 L 320 20 L 680 20 L 680 260" visibility="hidden"/>
        <g id="goal-frame"></g>
        <g id="tallies"></g>
        <g id="shots-layer" pointer-events="none"></g>
        <g id="tokens-layer"></g>
        <g id="draw-layer" pointer-events="none">
          <line id="draw-line" stroke="var(--fg)" stroke-width="5" stroke-linecap="round" visibility="hidden"/>
          <circle id="draw-origin" r="11" fill="var(--fg)" visibility="hidden"/>
          <circle id="draw-end" r="10" fill="none" stroke="var(--fg)" stroke-width="4" visibility="hidden"/>
          <text id="draw-zone" class="zone-tag" visibility="hidden"></text>
        </g>
      </svg>
      <div class="phase glass" role="group" aria-label="Alineación en pista">
        <button class="seg-btn press" type="button" data-phase="DEF" aria-pressed="true">🛡 Defensa</button>
        <button class="seg-btn press" type="button" data-phase="ATK" aria-pressed="false">⚔ Ataque</button>
        <button class="auto press" type="button" id="btn-auto" aria-pressed="true" title="Cambia sola tras cada posesión">Auto</button>
      </div>
      <span class="sample-tag" id="sample-tag">Ejemplo</span>
      <div class="armed-bar glass" id="armed-bar" hidden></div>
      <div class="alerts" id="alerts" aria-live="polite"></div>
      <div class="hint glass" id="hint" hidden></div>
    </section>

    <aside class="panel" aria-label="Portero, líneas de tiro y estadísticas">
      <div class="scroll">
        <!-- One control for the whole panel: the actions, or one team's KPIs and shot lines. -->
        <div class="seg team-seg" id="team-seg" role="group" aria-label="Acciones, o estadísticas y lanzamientos de un equipo">
          <button type="button" data-panel-mode="acts" aria-pressed="true"><b>Acciones</b></button>
          <button type="button" data-source="US" aria-pressed="false"><b id="seg-us"></b></button>
          <button type="button" data-source="GK" aria-pressed="false"><b id="seg-them">Rival</b></button>
        </div>
        <button class="gk-card press" id="gk-card" type="button" aria-label="Cambiar portero"></button>
        <div class="panel-acts" id="acts"></div>
        <div id="kpis" hidden>
        <h2 class="opt">Líneas</h2>
        <div class="lines" role="group" aria-label="Resultados que se dibujan">
          <button class="line-chip t-parada press" type="button" data-show="PARADA" aria-pressed="false"><i style="background:var(--parada)"></i>Parada</button>
          <button class="line-chip t-gol press" type="button" data-show="GOL" aria-pressed="false"><i style="background:var(--gol)"></i>Gol</button>
          <button class="line-chip t-fallo press" type="button" data-show="FALLO" aria-pressed="false"><i style="background:var(--fallo)"></i>Fallo</button>
        </div>
        <div id="live"></div>
        </div>
      </div>
    </aside>
  </div>

  <footer class="strip glass">
    <button class="btn back press" id="btn-home" type="button">‹ Partidos</button>
    <div class="events" id="events" aria-label="Últimas acciones (toca una para borrarla)"></div>
    <div class="strip-actions">
      <button class="btn press" id="btn-undo" type="button" aria-label="Deshacer">↶</button>
      <button class="btn press" id="btn-redo" type="button" aria-label="Rehacer">↷</button>
      <button class="btn primary press" id="btn-stop" type="button">⏸ Parar</button>
      <button class="btn press" id="btn-sheet" type="button">Hoja</button>
      <button class="btn press" id="btn-finish" type="button">Finalizar</button>
      <button class="btn icon press" id="btn-theme" type="button" aria-label="Cambiar a modo oscuro">☾</button>
    </div>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="pop" id="pop" role="dialog" aria-modal="false" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Hoja del partido" hidden></div>
<div class="final" id="final" role="dialog" aria-modal="true" aria-label="Resumen final" hidden></div>
<div class="home" id="home" role="dialog" aria-label="HBStats" hidden></div>
<input type="file" id="roster-file" accept=".json,application/json" hidden>
<input type="file" id="crest-file" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="photo-file" accept="image/png,image/jpeg,image/webp" hidden>

<script>
(() => {
  'use strict';

  // ===================== Configuration (coach-editable later) =====================
  const CONFIG = {
    halfSeconds: 30 * 60,
    scoreIntervalSeconds: 5 * 60,
    exclusionSeconds: 2 * 60,
    exclusionsToDisqualify: 3,
    timeoutSeconds: 60,
    timeoutsPerTeam: 3,
    maxFieldPlayers: 6,
    momentumWindowSeconds: 5 * 60,
    historyLimit: 300,
    tickMs: 250,
    hintMs: 2600,
    // Shot zones by distance from the goal (m): the dashed 9 m line itself already counts as 9 m.
    zones: { nineFromM: 8.7, elevenFromM: 11 },
    // A leaderboard needs this many shots before a player is ranked on shooting accuracy.
    leaders: { minShots: 3 },
    // Player photos are kept as small square JPEGs this wide.
    photoSizePx: 128,
    // Who usually shoots from a spot (m): wings wide and close to the goal line, pivots close and central, centre backs central.
    shooterZones: { wingDxM: 6, wingDyM: 5, pivotM: 7.5, pivotDxM: 4, centreDxM: 2.8 },
    // An armed panel action waits this long for the player.
    armMs: 4000,
    // The strip's «Finalizar» asks «¿Seguro?» and waits this long for the second tap.
    finishConfirmMs: 4000,
    dragThresholdPx: 10,
    minShotLengthUnits: 40,
    swapRadiusUnits: 70,
    palmGuardMs: 600,
    // Clock corrections, shown as a minus row and a plus row; taps add up (+10 +5 +1 = 16 s).
    clockSteps: [-10, -5, -1, 1, 5, 10],
    // Turnover types grouped by what went wrong, one colour per group (coach-editable later)
    turnoverGroups: [
      { label: 'Balón', cls: 'c-act-bad', types: ['Pase', 'Recepción', 'Bote'] },
      { label: 'Regla', cls: 'c-act-rule', types: ['Pasos', 'Dobles', 'Área', 'Pasivo'] },
      // Forced by the rival; a blocked shot is logged as a turnover and still counted as blocked
      { label: 'Rival', cls: 'c-act-rival', types: ['Falta ataque', 'Bloqueado'] }
    ],
    defFaultGroups: [
      { label: 'Regla', cls: 'c-act-bad', actions: ['FALTA', 'PEN7C', 'GOLPE'] },
      { label: 'Táctico', cls: 'c-act-bad', actions: ['BEATEN', 'BADEXIT', 'LATE', 'HELP'] },
      // Faults of the whole defence, logged with one tap and no player
      { label: 'Equipo', cls: 'c-act-rival', actions: ['NOATK'], team: true }
    ],
    positions: {
      EXT: { label: 'Extremo', color: 'var(--ext)', darkText: false },
      LAT: { label: 'Lateral', color: 'var(--lat)', darkText: false },
      CEN: { label: 'Central', color: 'var(--cen)', darkText: false },
      PIV: { label: 'Pivote', color: 'var(--piv)', darkText: true },
      POR: { label: 'Portero', color: 'var(--por)', darkText: false }
    },
    // Reference values for a senior regional team: [good from, poor below]; 'lower' = lower is better.
    targets: {
      shooting: [60, 50], '6M': [70, 55], '9M': [45, 35], '11M': [45, 35], CONTRA: [80, 65], '7M': [75, 60],
      attack: [50, 40], turnovers: [12, 20, 'lower'], gk: [33, 25], defense: [55, 45]
    },
    // Key points only speak from a minimum of evidence.
    insights: { minShots: 3, minGoals: 2, penetrationShare: 50, minBlocked: 3, minRepeats: 2 },
    // Attendance: a rate under warnPct warns; the excluded codes count neither for nor against; a player's note is
    // cut at noteMax characters; changes reach the cloud after syncDelayMs without further taps.
    attendance: { warnPct: 75, excludeFromRate: ['L'], noteMax: 60, syncDelayMs: 2000 }
  };
  /* CLOUD — tools/build_site.py sets this from config/cloud.json ({ url, anonKey } of the Supabase project).
     null = no accounts: teams and matches stay on this device (tests, previews). */
  const CLOUD_CONFIG = null;
  /* /CLOUD */
  /* DEMO — tools/build_site.py sets this for the public demo page: the sample match, no sign-in, nothing saved. */
  const DEMO = true;
  /* /DEMO */
  // Where the demo sends coaches who want to use their own account.
  const APP_URL = '../';
  // The team the app wears (name, colours, crest): the signed-in coach's team once the home screen loads it.
  const DEFAULT_TEAM = { id: null, club: 'Mi club', name: 'Mi equipo', brand: '#d4202a', brand2: '#f5c400', brandInk: '#ffffff', crest: null };
  let team = DEFAULT_TEAM;
  // AGPL-3.0: anyone using the app gets a link to its source code.
  const SOURCE_URL = 'https://github.com/abuenoa/hbstats';
  const sourceNoteHtml = () => `<p class="note">HBStats es software libre (AGPL-3.0): <a href="${SOURCE_URL}" target="_blank" rel="noopener">código fuente y contribuciones</a>.</p>`;
  const PHASES = { DEF: 'Defensa', ATK: 'Ataque' };
  const DEFAULT_PHASE = 'DEF';
  const THEME_KEY = 'hbstats-directo:theme';

  // ===================== Court geometry (SVG units, 50 per metre) =====================
  const UNITS_PER_M = 50;
  const GOAL_LINE_Y = 260;
  const CENTER_X = 500;
  const POST_HALF_M = 1.5;

    if (b.dataset.clockMode) { state.clockDown = b.dataset.clockMode === 'down'; commit(); openClockPop(v.anchor); return; }
    if (b.dataset.fix) {
      const [team, delta] = b.dataset.fix.split(':');
      addEvent('SCORE_FIX', { team, delta: Number(delta) });

      return;
    }
    if (b.dataset.delete) { closePop(); deleteEvent(b.dataset.delete); }
  });
  $('pop').addEventListener('input', (ev) => {
    if (ev.target.id === 'clock-input') ev.target.value = maskClockText(ev.target.value);
  });
  $('pop').addEventListener('focusin', (ev) => { if (ev.target.id === 'clock-input') ev.target.select(); });
  $('pop').addEventListener('submit', (ev) => {
    if (ev.target.id !== 'clock-set') return;

  $('scrim').addEventListener('pointerdown', (ev) => { ev.preventDefault(); closePop(); });
  $('armed-bar').addEventListener('click', (ev) => { if (!ev.target.closest('[data-unarm]')) return; if (ui.penalty && !ui.shooter) cancelPenalty(); else disarm(); });
  document.addEventListener('keydown', (ev) => {

  // ===================== Court gestures (finger and pen) =====================
  // Empty court → goal: in defence a rival shot; in attack always our shot (armed player, else pick one; the last shooter is preselected).
  // Player token → goal: that player's shot from where the token stands. Player token → court: move it.
  const svg = $('court');
  function svgPoint(x, y) {
    const pt = svg.createSVGPoint();
    pt.x = x; pt.y = y;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function isPalm(ev) {
    if (ev.pointerType === 'pen') { ui.lastPenTs = Date.now(); return false; }
    return ev.pointerType === 'touch' && Date.now() - ui.lastPenTs < CONFIG.palmGuardMs;
  }
  const insideRect = (el, x, y) => { const r = el.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; };
  const setAttrs = (el, attrs) => Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  const clampCourt = (pt) => ({ x: clamp(pt.x, COURT.minX, COURT.maxX), y: clamp(pt.y, COURT.minY, COURT.maxY) });
  const DRAW_IDS = ['draw-line', 'draw-origin', 'draw-end', 'draw-zone'];
  const setDraw = (on) => DRAW_IDS.forEach((id) => $(id).setAttribute('visibility', on ? 'visible' : 'hidden'));
  function startDraw(origin, zone = ui.penalty ? '7M' : zoneFrom(origin)) {
    setAttrs($('draw-origin'), { cx: origin.x, cy: origin.y });
    setAttrs($('draw-line'), { x1: origin.x, y1: origin.y, x2: origin.x, y2: origin.y });
    const tag = $('draw-zone');
    setAttrs(tag, { x: origin.x, y: Math.min(origin.y + ZONE_TAG_OFFSET + 12, COURT.maxY + 20) });
    tag.textContent = ZONES[zone];
  }
  function moveDraw(pt) {
    setDraw(true);
    setAttrs($('draw-line'), { x2: pt.x, y2: pt.y });
    setAttrs($('draw-end'), { cx: pt.x, cy: pt.y });
    highlightGoal(pt);
  }
  function highlightGoal(pt) {
    const frame = Boolean(pt) && onGoalFrame(pt);
    const face = Boolean(pt) && !frame && inGoalFace(pt);
    $('goal-face').classList.toggle('hot', face || frame);
    $('goal-frame-hot').setAttribute('visibility', frame ? 'visible' : 'hidden');
    const sector = $('goal-sector');
    sector.setAttribute('visibility', face ? 'visible' : 'hidden');
    if (!face) return;
    const [row, col] = goalCell(pt);
    setAttrs(sector, { x: GOAL_FACE.x + (col * GOAL_FACE.w) / GOAL_GRID, y: GOAL_FACE.y + (row * GOAL_FACE.h) / GOAL_GRID, width: GOAL_FACE.w / GOAL_GRID, height: GOAL_FACE.h / GOAL_GRID });
  }
  function stopDraw() { setDraw(false); highlightGoal(null); }
  const goalTarget = (pt) => ({ x: clamp(pt.x, GOAL_FACE.x - GOAL_MARGIN, GOAL_FACE.x + GOAL_FACE.w + GOAL_MARGIN), y: clamp(pt.y, 0, GOAL_LINE_Y) });

  svg.addEventListener('pointerdown', (ev) => {
    if (isPalm(ev) || ui.drag) return;
    const tok = ev.target.closest('.tok');
    const pt = svgPoint(ev.clientX, ev.clientY);
    if (tok) {
      const id = tok.dataset.id;
      const isGk = tok.classList.contains('gk');
      const start = isGk ? GK_SPOT : lineup()[id];
      ui.drag = { type: 'token', id, el: tok, isGk, start, grab: { x: pt.x, y: pt.y }, startX: ev.clientX, startY: ev.clientY, moved: false, toGoal: false, pointerId: ev.pointerId };
    } else if (pt.y > GOAL_LINE_Y) {
      ui.drag = { type: 'shot', origin: ui.penalty ? { ...PENALTY_SPOT } : { x: pt.x, y: pt.y }, pointerId: ev.pointerId };
      startDraw(ui.drag.origin);
    } else return;
    svg.setPointerCapture(ev.pointerId);
    ev.preventDefault();
  });
  svg.addEventListener('pointermove', (ev) => {
    const d = ui.drag;
    if (!d || ev.pointerId !== d.pointerId || isPalm(ev)) return;
    const pt = svgPoint(ev.clientX, ev.clientY);
    if (d.type === 'shot') { moveDraw(pt); return; }
    if (d.isGk) return; // the goalkeeper stays in goal; change it from its popup or from the bench
    if (!d.moved && Math.hypot(ev.clientX - d.startX, ev.clientY - d.startY) < CONFIG.dragThresholdPx) return;
    if (!d.moved) { d.moved = true; startDraw(ui.penalty ? PENALTY_SPOT : state.phase === 'DEF' ? d.grab : d.start); }
    // Over the bench it is a substitution, never a shot, whatever height of the goal it is level with.
    d.toGoal = pt.y < GOAL_LINE_Y && !insideRect($('bench'), ev.clientX, ev.clientY);
    if (d.toGoal) {
      d.el.setAttribute('transform', `translate(${d.start.x} ${d.start.y})`);
      moveDraw(pt);
    } else {
      stopDraw();
      const c = clampCourt(pt);
      d.el.setAttribute('transform', `translate(${c.x} ${c.y})`);
      $('bench').classList.toggle('drop', insideRect($('bench'), ev.clientX, ev.clientY));
    }
  });
  function endCourtDrag(ev, cancelled) {
    const d = ui.drag;
    if (!d || ev.pointerId !== d.pointerId) return;
    ui.drag = null;
    $('bench').classList.remove('drop');
    stopDraw();
    if (cancelled) { renderTokens(); return; }
    const pt = svgPoint(ev.clientX, ev.clientY);
    const anchor = { x: ev.clientX, y: ev.clientY };
    if (d.type === 'token') {
      if (!d.moved) { if (ui.armedAction) applyArmedAction(d.id); else if (d.isGk) openGkPop(anchor); else openPlayerPop(d.id, anchor); return; }
      if (d.toGoal) {
        renderTokens();
        if (state.phase === 'ATK' && ourOffCourt().has(d.id)) { const p = playerById(d.id); hint(`#${p.num} ${p.name} no puede lanzar: ${isDisqualified(d.id) ? 'descalificado' : "cumple 2'"}`); return; }
        // Defending, a drag through one of our defenders is the rival's shot from that spot; attacking, it is that player's shot.
        if (ui.penalty) { shotFromDrag(PENALTY_SPOT, pt, anchor, ui.penalty.team === 'us' ? d.id : null); return; }
        const view = state.phase === 'DEF'
          ? { type: 'rivalShot', origin: d.grab, target: goalTarget(pt) }
          : { type: 'ourShot', playerId: d.id, origin: d.start, target: goalTarget(pt) };
        openShotPop(view, anchor);
        return;
      }
      const p = playerById(d.id);
      if (insideRect($('bench'), ev.clientX, ev.clientY)) {
        // Dropped on a bench player: the attack-defence change, in this phase only.
        const onto = [...document.querySelectorAll('#bench .bench-player')].find((el) => insideRect(el, ev.clientX, ev.clientY));
        const partner = onto ? playerById(onto.dataset.id) : null;
        const phaseName = PHASES[state.phase].toLowerCase();
        if (partner && partner.pos !== 'POR' && !isDisqualified(partner.id)) {
          swapInLineup({ phase: state.phase, spot: { ...lineup()[d.id] } }, d.id, partner.id);
          hint(`⇄ ataque-defensa en ${phaseName}: entra #${partner.num}, sale #${p.num}`);
        } else {
          delete lineup()[d.id];
          hint(`#${p.num} ${p.name} al banquillo (${phaseName})`);
        }
      } else lineup()[d.id] = clampCourt(pt);
      commit();
      return;
    }
    const len = Math.hypot(pt.x - d.origin.x, pt.y - d.origin.y);
    if (len < CONFIG.minShotLengthUnits || pt.y > GOAL_LINE_Y) { hint('Arrastra hasta la portería'); return; }
    shotFromDrag(d.origin, pt, anchor);
  }
  // A shot drawn to `pt` from empty court (or, with a pending penalty, from any token: `shooterId`).
  // A pending penalty starts on the mark and decides whose shot it is.
  function shotFromDrag(origin, pt, anchor, shooterId = null) {
    const target = goalTarget(pt);
    const pen = ui.penalty;
    if (pen) {
      const view = pen.team === 'us'
        ? { type: 'ourShot', playerId: shooterId || penaltyShooterId(), pick: !shooterId, origin: { ...PENALTY_SPOT }, target, penalty: true }
        : { type: 'rivalShot', origin: { ...PENALTY_SPOT }, target, penalty: true };
      openShotPop(view, anchor);
      return;
    }
    const view = ui.shooter || state.phase === 'ATK'
      ? { type: 'ourShot', playerId: ui.shooter || zoneShooterId(origin), pick: !ui.shooter, origin, target }
      : { type: 'rivalShot', origin, target };
    openShotPop(view, anchor);
  }
  svg.addEventListener('pointerup', (ev) => endCourtDrag(ev, false));
  svg.addEventListener('pointercancel', (ev) => endCourtDrag(ev, true));

  // Bench: drag onto the court (onto a teammate = substitution; a goalkeeper replaces the goalkeeper)
  const benchEl = $('bench');

  function endBenchDrag(ev, cancelled) {
    const d = ui.drag;

    ui.drag = null;

    if (cancelled) return;
    if (!d.moved) { if (ui.armedAction) applyArmedAction(d.id); else openPlayerPop(d.id, { x: ev.clientX, y: ev.clientY }); return; }
    if (!insideRect(svg, ev.clientX, ev.clientY)) return;
    const incoming = playerById(d.id);
    if (isDisqualified(incoming.id)) { hint(`#${incoming.num} ${incoming.name} está descalificado`); return; }
    if (incoming.pos === 'POR') { state.gkId = incoming.id; commit(); hint(`Portero: #${incoming.num} ${incoming.name}`); return; }
    const pt = svgPoint(ev.clientX, ev.clientY);
    const team = lineup();
    const phaseName = PHASES[state.phase].toLowerCase();
    let nearest = null, best = CONFIG.swapRadiusUnits;
    Object.entries(team).forEach(([id, pos]) => {
      const dist = Math.hypot(pos.x - pt.x, pos.y - pt.y);
      if (dist < best) { best = dist; nearest = id; }
    });
    if (nearest) {
      const out = playerById(nearest);

    } else if (Object.keys(team).length < CONFIG.maxFieldPlayers) {
      team[d.id] = clampCourt(pt);
      hint(`Entra #${incoming.num} en ${phaseName}`);
    } else {
      hint('Pista llena: suéltalo encima de quien sale');

    }
    commit();
  }

  // ===================== Match sheet: statistics, goalkeeper, roster, PDF reports =====================
  const SHEET_TABS = { stats: 'Estadísticas', player: 'Jugador', analysis: 'Análisis', gk: 'Portero', acta: 'Acta y plantilla', reports: 'Informes PDF' };
  const MAX_ROSTER = 16;
  const MAX_NAME_LENGTH = 24;
  // The name on the official card and the face photo (a small data URL, see supabase/schema.sql for the same limits).
  const MAX_FULL_NAME_LENGTH = 80;
  const MAX_PHOTO_LENGTH = 60000;
  const DORSAL_RANGE = [1, 99];
  const ROSTER_FORMAT = 'hbstats-plantilla';
  const MAX_VENUE_LENGTH = 40;
  const PLAYER_HEAD = ['Nº', 'Jugador', '6 m', '9 m', '+11 m', 'Contra', '7 m', 'T. bloq.', 'Bloc.', 'Recup.', 'Pase gol', 'Pérdida', 'Prov. 7 m', 'Falta', '7 m com.', 'F. táctico', 'A', "2'", 'D', 'Az'];
  const SHOT_ZONE_HEAD = ['Zona', 'Lanz.', 'Goles', 'Parados', 'Fallados', '% gol'];
  const GK_ZONE_HEAD = ['Zona', 'Recibidos', 'A puerta', 'Detenidos', 'Encajados', '% paradas'];
  const fieldPlayers = () => state.players.filter((p) => p.pos !== 'POR').sort((a, b) => a.num - b.num);
  const goalkeepers = () => state.players.filter((p) => p.pos === 'POR').sort((a, b) => a.num - b.num);

  // ---- Shared figures (the same numbers feed the screen and the PDF) ----
  function countBy(events, keyOf) {
    const out = {};
    events.forEach((e) => { const k = keyOf(e); out[k] = (out[k] || 0) + 1; });
    return out;
  }
  const turnoverCounts = (events) => countBy(events.filter((e) => e.kind === 'TURNOVER'), (e) => e.subtype);
  const defFaultCounts = (events) => countBy(events.filter((e) => e.kind === 'ACTION' && DEFENSIVE_FAULTS.includes(e.action)), (e) => ACTIONS[e.action].label);
  const eventsOf = (id, events = state.events) => events.filter((e) => e.playerId === id);
  function playerRow(p) {
    const s = playerStats(p.id);
    // Team faults count too: matches logged before they became team faults have them per player.
    const tactical = [...TACTICAL_FAULTS, ...TEAM_FAULTS].reduce((n, k) => n + s[k], 0);
    return [p.num, p.name, ...SHEET_ZONES.map((z) => `${s.shots[z]}/${s.goals[z]}`), s.blocked, s.BLOC, s.RECUP, s.ASIST, s.TURNOVER, s.PROV7, s.FALTA + s.GOLPE, s.PEN7C, tactical, s.A, s['2M'], s.D, s.AZ];
  }
  function shotZoneRows(shots) {
    const row = (label, list) => { const c = countGroups(list); return [label, list.length, c.GOL, c.PARADA, c.FALLO, pctText(pct(c.GOL, list.length))]; };
    return [...SHEET_ZONES.map((z) => row(ZONES[z], shots.filter((e) => e.zone === z))), row('Total', shots)];
  }
  const gkZoneOf = (e) => (e.contra ? 'CONTRA' : e.zone);
  function gkZoneRows(shots) {
    const row = (label, list) => { const c = countGroups(list); const on = c.GOL + c.PARADA; return [label, list.length, on, c.PARADA, c.GOL, pctText(pct(c.PARADA, on))]; };
    return [...SHEET_ZONES.map((z) => row(ZONES[z], shots.filter((e) => gkZoneOf(e) === z))), row('Total', shots)];
  }
  const gkPool = (gkId) => (gkId ? gkShots(gkId) : rivalShots());
  function goalGrid(shots, group) {
    const grid = Array.from({ length: GOAL_GRID }, () => Array(GOAL_GRID).fill(0));
    shots.filter((e) => groupOf(e.result) === group && inGoalFace(e.target)).forEach((e) => {
      const [row, col] = goalCell(e.target);
      grid[row][col]++;
    });
    return grid;
  }
  // ---- Attack analysis, the same for both teams: lanes, depth, shooters, goal sectors and key points ----
  // Lanes from the attacker's view, by the angle from the goal centre: centre up to 15°, back court up to 55°, wing beyond.
  const LANES = [
    { id: 'EXT_I', label: 'Extremo izq.' }, { id: 'LAT_I', label: 'Lateral izq.' }, { id: 'CEN', label: 'Centro' },
    { id: 'LAT_D', label: 'Lateral der.' }, { id: 'EXT_D', label: 'Extremo der.' }
  ];
  const LANE_EDGES_DEG = [15, 55];
  function laneOf(origin) {
    const deg = (Math.atan2(origin.x - CENTER_X, Math.max(origin.y - GOAL_LINE_Y, 1)) * 180) / Math.PI;
    const a = Math.abs(deg);
    if (a <= LANE_EDGES_DEG[0]) return 'CEN';
    return `${a <= LANE_EDGES_DEG[1] ? 'LAT' : 'EXT'}_${deg < 0 ? 'I' : 'D'}`;
  }
  const laneLabel = (id) => LANES.find((l) => l.id === id).label;
  const GOAL_ROWS = ['arriba', 'a media altura', 'abajo'];
  const GOAL_COLS = ['izquierda', 'centro', 'derecha'];
  const sectorName = ([row, col]) => `${GOAL_ROWS[row]} ${GOAL_COLS[col]}`;
  const LANE_HEAD = ['Carril', '6 m', '9 m o más', 'Total', '% gol'];
  // Lanes split penetration (6 m) from shots taken from distance (9 m and +11 m).
  const FAR_ZONES = ['9M', '11M'];
  const SHOOTER_HEAD = ['Jugador', 'Tiros', 'Goles', '% gol'];
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const goalsIn = (list) => list.filter((e) => e.result === 'GOL').length;
  const gt = (list) => `${goalsIn(list)}/${list.length}`;
  function topCell(grid) {
    let best = null;
    grid.forEach((cols, row) => cols.forEach((n, col) => { if (n && (!best || n > best.n)) best = { n, cell: [row, col] }; }));
    return best;
  }
  function attackAnalysis(team) {
    const ours = team === 'us';
    const shots = ours ? ourShots() : rivalShots();
    const depthOf = (e) => (ours ? e.from : e.zone);
    const field = shots.filter((e) => depthOf(e) !== '7M');
    const lanes = LANES.map((l) => {
      const inLane = field.filter((e) => laneOf(e.origin) === l.id);
      return { ...l, list: inLane, near: inLane.filter((e) => depthOf(e) === '6M'), far: inLane.filter((e) => FAR_ZONES.includes(depthOf(e))) };
    });
    const shooters = shooterRanking(shots).filter((g) => g.shooter).map((g) => ({ label: g.label, shots: g.list.length, goals: g.goals }))
      .sort((a, b) => b.shots - a.shots || b.goals - a.goals);
    const topScorer = shooters.slice().sort((a, b) => b.goals - a.goals || a.shots - b.shots)[0] || null;
    const near = field.filter((e) => depthOf(e) === '6M'), far = field.filter((e) => FAR_ZONES.includes(depthOf(e)));
    const isContra = (e) => (ours ? e.zone === 'CONTRA' : e.contra);
    return {
      ours, shots, field, lanes, shooters, topShooter: shooters[0] || null, topScorer: topScorer && topScorer.goals ? topScorer : null,

  }
  const laneRows = (a) => a.lanes.map((l) => [l.label, gt(l.near), gt(l.far), gt(l.list), pctText(pct(goalsIn(l.list), l.list.length))]);
  const shooterRows = (a) => a.shooters.map((x) => [x.label, x.shots, x.goals, pctText(pct(x.goals, x.shots))]);
  const bestLane = (a, minGoals) => a.lanes.filter((l) => goalsIn(l.list) >= minGoals).sort((x, y) => goalsIn(y.list) - goalsIn(x.list) || x.list.length - y.list.length)[0] || null;
  // Key points as { tone: 'bad' | 'good', text }: what the rival does to us, and how our attack goes.
  function keyPoints() {
    const k = CONFIG.insights;
    const live = liveStats();
    const them = attackAnalysis('them'), us = attackAnalysis('us');
    const defence = [], attack = [];
    const bad = (list, text) => list.push({ tone: 'bad', text });
    const good = (list, text) => list.push({ tone: 'good', text });
    const hurt = bestLane(them, k.minGoals);
    if (hurt) bad(defence, `Más goles encajados por ${hurt.label.toLowerCase()}: ${gt(hurt.list)}.`);
    if (them.field.length >= k.minShots && them.penetrationShare >= k.penetrationShare) bad(defence, `Os penetran: el ${them.penetrationShare}% de sus tiros llega desde 6 m (${gt(them.near)}).`);
    else if (goalsIn(them.far) >= k.minGoals && goalsIn(them.far) >= goalsIn(them.near)) bad(defence, `Os hacen daño desde 9 m (${gt(them.far)}): salir más a sus lanzadores.`);
    if (them.topScorer && them.topScorer.goals >= k.minGoals) bad(defence, `Vigilar a ${them.topScorer.label}: ${plural(them.topScorer.goals, 'gol', 'goles')} en ${plural(them.topScorer.shots, 'tiro', 'tiros')}.`);
    if (them.goalSector && them.goalSector.n >= k.minGoals) bad(defence, `Encajáis sobre todo ${sectorName(them.goalSector.cell)} (${them.goalSector.n} goles).`);
    if (them.contraGoals >= k.minGoals) bad(defence, `${them.contraGoals} goles encajados a la contra: mejorar el repliegue.`);
    if (them.penalties.length >= k.minRepeats) bad(defence, `${them.penalties.length} penaltis en contra (marcan ${goalsIn(them.penalties)}).`);
    const faults = Object.entries(defFaultCounts(state.events)).sort((a, b) => b[1] - a[1])[0];
    if (faults && faults[1] >= k.minRepeats) bad(defence, `Fallo defensivo más repetido: ${faults[0].toLowerCase()} (${faults[1]}).`);
    const gkRate = rate(live.them.savedPct, 'gk');
    if (gkRate === 'r-bad') bad(defence, `Pocas paradas: ${live.them.savedPct}% (objetivo ${CONFIG.targets.gk[0]}%).`);
    if (gkRate === 'r-good') good(defence, `Buen nivel en portería: ${live.them.savedPct}% de paradas.`);

    if (rate(live.us.shooting, 'shooting') === 'r-bad') bad(attack, `Acierto bajo en el tiro: ${live.us.shooting}% (${live.us.goals}/${live.us.shots}).`);
    const weakZone = live.us.zones.filter((z) => z.att >= k.minShots && rate(z.pct, z.id) === 'r-bad').sort((a, b) => a.pct - b.pct)[0];
    if (weakZone) bad(attack, `Poco acierto desde ${ZONES[weakZone.id]}: ${weakZone.GOL}/${weakZone.att}.`);
    if (rate(live.us.turnoverPct, 'turnovers') === 'r-bad') {
      const top = Object.entries(turnoverCounts(state.events)).sort((a, b) => b[1] - a[1])[0];
      bad(attack, `Demasiadas pérdidas: ${live.us.turnovers} en ${live.us.possessions} posesiones${top ? `; la más repetida, ${top[0].toLowerCase()} (${top[1]})` : ''}.`);
    }
    if (us.blocked >= k.minBlocked) bad(attack, `${us.blocked} tiros bloqueados: buscar mejores posiciones de lanzamiento.`);
    if (us.saveSector && us.saveSector.n >= k.minRepeats) bad(attack, `Su portero os para sobre todo ${sectorName(us.saveSector.cell)} (${us.saveSector.n}).`);
    const works = bestLane(us, k.minGoals);
    if (works) good(attack, `Funciona el ataque por ${works.label.toLowerCase()}: ${gt(works.list)}.`);
    if (us.topScorer && us.topScorer.goals >= k.minGoals) good(attack, `Máximo goleador: ${us.topScorer.label}, ${us.topScorer.goals} de ${us.topScorer.shots}.`);

  // Who took a shot: one of our players or a rival dorsal; null when it was logged without one.
  const shooterOf = (e, s = state) => (e.kind === 'SHOT' ? playerById(e.playerId, s) : rivalById(e.rivalId, s)) || null;

  // Shooters on one goal ranked by the damage they did: goals, then shots, then dorsal; unidentified shots go last.

    const marks = shots.slice().sort((a, b) => Number(focused(a)) - Number(focused(b))).map((e) => {

        ? `<circle cx="${x}" cy="${y}" r="${MAP_DORSAL_R}" fill="${color}" stroke="var(--surface)" stroke-width="3"/><text class="map-dorsal" x="${x}" y="${y}">${shooter.num}</text>`

  // Points at a fixed distance from the goal segment (the 6 m and 9 m lines), in court units.
  function areaLine(metres) {
    const r = metres * UNITS_PER_M;

    const steps = 18;
    const pts = [];
    for (let i = 0; i <= steps; i++) { const a = (i / steps) * (Math.PI / 2); pts.push({ x: CENTER_X - half - r * Math.cos(a), y: GOAL_LINE_Y + r * Math.sin(a) }); }
    for (let i = steps; i >= 0; i--) { const a = (i / steps) * (Math.PI / 2); pts.push({ x: CENTER_X + half + r * Math.cos(a), y: GOAL_LINE_Y + r * Math.sin(a) }); }

    const polyline = (pts) => pts.slice(1).forEach((pt, i) => doc.line(...P(pts[i]), ...P(pt)));

    doc.rect(x, y + GOAL_LINE_Y * k, w, (COURT_VIEW_H - GOAL_LINE_Y) * k, 'F');
    doc.setFillColor(255, 255, 255);

    doc.setLineWidth(0.2);
    doc.setLineDashPattern([0.8, 0.8], 0);

    }
    doc.setDrawColor(...PDF_RGB.line);
    doc.setLineWidth(0.35);
    doc.setLineDashPattern([], 0);
    doc.line(...P({ x: 0, y: GOAL_LINE_Y }), ...P({ x: 1000, y: GOAL_LINE_Y }));
    polyline(areaLine(6));
    doc.setLineDashPattern([1.5, 1.2], 0);
    polyline(areaLine(NINE_M));
    doc.setLineDashPattern([0.4, 1.4], 0);
    polyline(areaLine(ELEVEN_M));
    doc.setLineDashPattern([], 0);

    doc.line(...P(m(-0.5, SEVEN_M.dy)), ...P(m(0.5, SEVEN_M.dy)));

    doc.setLineWidth(1.2);
    polyline([{ x: GOAL_FACE.x, y: GOAL_LINE_Y }, { x: GOAL_FACE.x, y: GOAL_FACE.y }, { x: GOAL_FACE.x + GOAL_FACE.w, y: GOAL_FACE.y }, { x: GOAL_FACE.x + GOAL_FACE.w, y: GOAL_LINE_Y }]);
    shots.forEach((e) => {

      doc.setDrawColor(...color);
      doc.setFillColor(...color);
      doc.setLineWidth(0.45);
      doc.setLineDashPattern(PDF_DASH[g], 0);
      doc.line(...P(e.origin), ...P(e.target));
      doc.setLineDashPattern([], 0);
      doc.circle(...P(e.origin), 0.9, 'F');
      doc.setFillColor(255, 255, 255);
      doc.circle(...P(e.target), 0.8, 'FD');
    });
    if (dorsals) {
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(PDF_DORSAL.fontSize);
      doc.setDrawColor(255, 255, 255);
      doc.setLineWidth(0.3);
      shots.forEach((e) => {
        const s = shooterOf(e);
        if (!s) return;
        doc.setFillColor(...view.colors[groupOf(e.result)]);
        doc.circle(...P(e.origin), PDF_DORSAL.r, 'FD');
        doc.setTextColor(255, 255, 255);

    const emails = parseEmails($('final-email').value);
    if (!emails) { finalStatus('Escribe una o varias direcciones de correo válidas, separadas por comas.'); return; }
    state.reportEmail = emails.join(', ');
    save();
    finalStatus('Preparando los PDF…');
    try {
      const files = await reportFiles();
      for (const f of files) await offerFile(f.filename, f.blob);
      finalStatus(`Descargados: ${files.map((f) => f.filename).join(', ')}. Abriendo el correo…`);
      window.location.href = mailtoUrl(emails, files.map((f) => f.filename));
    } catch (err) {
      console.error('Report e-mail failed', err);
      finalStatus(err instanceof Error ? `No se pudieron preparar los PDF: ${err.message}.` : fileErrorText(err));
    }
  }
  async function shareReports() {
    finalStatus('Preparando los PDF…');
    try {
      const files = (await reportFiles()).map((f) => new File([f.blob], f.filename, { type: 'application/pdf' }));
      if (!navigator.canShare || !navigator.canShare({ files })) { finalStatus('Este dispositivo no permite compartir archivos: usa «Enviar por correo».'); return; }
      await navigator.share({ files, title: `Informe ${finalTitle()}`, text: finalText() });
      finalStatus('Compartido.');
    } catch (err) {
      if (err && err.name === 'AbortError') { finalStatus('Compartir cancelado.'); return; }
      console.error('Report share failed', err);
      finalStatus(`No se pudo compartir: ${(err && err.message) || 'error desconocido'}.`);
    }
  }

  const SUPABASE_JS_URL = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
  const MATCH_KEY_PREFIX = 'hbstats:match:';
