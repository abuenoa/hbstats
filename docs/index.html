  // ===================== Match sheet: statistics, goalkeeper, roster, PDF reports =====================
  const SHEET_TABS = { summary: 'Resumen', stats: 'Tablas', player: 'Jugador', analysis: 'Análisis', gk: 'Portero', acta: 'Acta y plantilla', reports: 'Informes PDF' };
  const MAX_ROSTER = 16;
  // A rival's season squad: more than the 16 on a match sheet, so its names and dorsals are entered once.
  const MAX_RIVAL_ROSTER = 30;
  const MAX_NAME_LENGTH = 24;
  // The name on the official card and the face photo (a small data URL, see supabase/schema.sql for the same limits).
  const MAX_FULL_NAME_LENGTH = 80;
  const MAX_PHOTO_LENGTH = 60000;
  const DORSAL_RANGE = [1, 99];
  const ROSTER_FORMAT = 'hbstats-plantilla';
  const MAX_VENUE_LENGTH = 40;
  const PLAYER_HEAD = ['Nº', 'Jugador', 'Min', '+/−', '6 m', '9 m', '+11 m', 'Contra', '7 m', 'T. bloq.', 'Bloc.', 'Recup.', 'Pase gol', 'Pérdida', 'Prov. 7 m', 'Falta', '7 m com.', 'F. táctico', 'A', "2'", 'D', 'Az'];
  const SHOT_ZONE_HEAD = ['Zona', 'Lanz.', 'Goles', 'Parados', 'Fallados', '% gol'];
  const GK_ZONE_HEAD = ['Zona', 'Recibidos', 'A puerta', 'Detenidos', 'Encajados', '% paradas'];
  const fieldPlayers = () => state.players.filter((p) => p.pos !== 'POR').sort((a, b) => a.num - b.num);
  const goalkeepers = () => state.players.filter((p) => p.pos === 'POR').sort((a, b) => a.num - b.num);

  // ---- Shared figures (the same numbers feed the screen and the PDF) ----
  function countBy(events, keyOf) {
    const out = {};
    events.forEach((e) => { const k = keyOf(e); out[k] = (out[k] || 0) + 1; });
    return out;
  }
  const turnoverCounts = (events) => countBy(events.filter((e) => e.kind === 'TURNOVER'), (e) => e.subtype);
  const defFaultCounts = (events) => countBy(events.filter((e) => e.kind === 'ACTION' && DEFENSIVE_FAULTS.includes(e.action)), (e) => ACTIONS[e.action].label);
  const eventsOf = (id, events = state.events) => events.filter((e) => e.playerId === id);
  // One row of the player table, as PLAYER_HEAD; Min and +/− read «–» when the match logged no court.
  function playerRow(p, s = state) {
    const stats = playerStats(p.id, s.events), court = courtFiguresOf(s, p.id);
    // Team faults count too: matches logged before they became team faults have them per player.
    const tactical = [...TACTICAL_FAULTS, ...TEAM_FAULTS].reduce((n, k) => n + stats[k], 0);
    return [p.num, p.name, minutesText(court.seconds), plusMinusText(court.plusMinus), ...SHEET_ZONES.map((z) => `${stats.goals[z]}/${stats.shots[z]}`), stats.blocked, stats.BLOC, stats.RECUP, stats.ASIST, stats.TURNOVER, stats.PROV7, stats.FALTA + stats.GOLPE, stats.PEN7C, tactical, stats.A, stats['2M'], stats.D, stats.AZ];
  }
  function shotZoneRows(shots) {
    const row = (label, list) => { const c = countGroups(list); return [label, list.length, c.GOL, c.PARADA, c.FALLO, pctText(pct(c.GOL, list.length))]; };
    return [...SHEET_ZONES.map((z) => row(ZONES[z], shots.filter((e) => e.zone === z))), row('Total', shots)];
  }
  const gkZoneOf = (e) => (e.contra ? 'CONTRA' : e.zone);
  function gkZoneRows(shots) {
    const row = (label, list) => { const c = countGroups(list); const on = c.GOL + c.PARADA; return [label, list.length, on, c.PARADA, c.GOL, pctText(pct(c.PARADA, on))]; };
    return [...SHEET_ZONES.map((z) => row(ZONES[z], shots.filter((e) => gkZoneOf(e) === z))), row('Total', shots)];
  }
  // Goals/shots of each attack type for both teams, and the total, which equals the shots of each team.
  function attackTypeTableRows(events = state.events) {
    const us = attackTypeRows(events, 'us'), them = attackTypeRows(events, 'them');
    const cells = ({ goals, shots }) => [`${goals}/${shots}`, pctText(pct(goals, shots))];
    const totalOf = (rows) => ({ goals: sumOf(rows, (r) => r.goals), shots: sumOf(rows, (r) => r.shots) });
    return [...us.map((r, i) => [ATTACK_TYPES[r.type], ...cells(r), ...cells(them[i])]), ['Total', ...cells(totalOf(us)), ...cells(totalOf(them))]];
  }
  const TURNOVER_PLAYER_HEAD = ['Nº', 'Jugador', ...CONFIG.turnoverGroups.map((g) => g.label), 'Total'];
  // Turnovers of each player by group, most first, and the total of the squad; one row saying so when there are none.
  function turnoverPlayerRows(s = state) {
    const groups = CONFIG.turnoverGroups;
    const lost = turnoversByPlayer([{ state: s }], s.players);
    if (!lost.length) return [[PDF_EMPTY, 'Sin pérdidas', ...groups.map(() => 0), 0]];
    const rows = lost.map(({ player, total, byType }) => [player.num, player.name, ...groups.map((g) => sumOf(g.types, (t) => byType[t] || 0)), total]);
    return [...rows, ['', 'Total', ...groups.map((g, i) => sumOf(rows, (r) => r[i + 2])), sumOf(rows, (r) => r.at(-1))]];
  }
  const gkPool = (gkId) => (gkId ? gkShots(gkId) : rivalShots());
  function goalGrid(shots, group) {
    const grid = Array.from({ length: GOAL_GRID }, () => Array(GOAL_GRID).fill(0));
    shots.filter((e) => groupOf(e.result) === group && inGoalFace(e.target)).forEach((e) => {
      const [row, col] = goalCell(e.target);
      grid[row][col]++;
    });
    return grid;
  }
  // ---- Attack analysis, the same for both teams: lanes, depth, shooters, goal sectors and key points ----
  // Lanes from the attacker's view, by the angle from the goal centre: centre up to 15°, back court up to 55°, wing beyond.
  const LANES = [
    { id: 'EXT_I', label: 'Extremo izq.' }, { id: 'LAT_I', label: 'Lateral izq.' }, { id: 'CEN', label: 'Centro' },
    { id: 'LAT_D', label: 'Lateral der.' }, { id: 'EXT_D', label: 'Extremo der.' }
  ];
  const LANE_EDGES_DEG = [15, 55];
  function laneOf(origin) {
    const deg = (Math.atan2(origin.x - CENTER_X, Math.max(origin.y - GOAL_LINE_Y, 1)) * 180) / Math.PI;
    const a = Math.abs(deg);
    if (a <= LANE_EDGES_DEG[0]) return 'CEN';
    return `${a <= LANE_EDGES_DEG[1] ? 'LAT' : 'EXT'}_${deg < 0 ? 'I' : 'D'}`;
  }
  const laneLabel = (id) => LANES.find((l) => l.id === id).label;
  const GOAL_ROWS = ['arriba', 'a media altura', 'abajo'];
  const GOAL_COLS = ['izquierda', 'centro', 'derecha'];
  const sectorName = ([row, col]) => `${GOAL_ROWS[row]} ${GOAL_COLS[col]}`;
  const LANE_HEAD = ['Carril', '6 m', '9 m o más', 'Total', '% gol'];
  // Lanes split penetration (6 m) from shots taken from distance (9 m and +11 m).
  const FAR_ZONES = ['9M', '11M'];
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const goalsIn = (list) => list.filter((e) => e.result === 'GOL').length;
  const gt = (list) => `${goalsIn(list)}/${list.length}`;
  function topCell(grid) {
    let best = null;
    grid.forEach((cols, row) => cols.forEach((n, col) => { if (n && (!best || n > best.n)) best = { n, cell: [row, col] }; }));
    return best;
  }
  function attackAnalysis(team) {
    const ours = team === 'us';
    const shots = ours ? ourShots() : rivalShots();
    const depthOf = (e) => (ours ? e.from : e.zone);
    const field = shots.filter((e) => depthOf(e) !== '7M');
    const lanes = LANES.map((l) => {
      const inLane = field.filter((e) => laneOf(e.origin) === l.id);
      return { ...l, list: inLane, near: inLane.filter((e) => depthOf(e) === '6M'), far: inLane.filter((e) => FAR_ZONES.includes(depthOf(e))) };
    });
    const shooters = shooterRanking(shots).filter((g) => g.shooter).map((g) => ({ label: g.label, shots: g.list.length, goals: g.goals }))
      .sort((a, b) => b.shots - a.shots || b.goals - a.goals);
    const topScorer = shooters.slice().sort((a, b) => b.goals - a.goals || a.shots - b.shots)[0] || null;
    const near = field.filter((e) => depthOf(e) === '6M'), far = field.filter((e) => FAR_ZONES.includes(depthOf(e)));
    const isContra = (e) => (ours ? e.zone === 'CONTRA' : e.contra);
    return {
      ours, shots, field, lanes, shooters, topShooter: shooters[0] || null, topScorer: topScorer && topScorer.goals ? topScorer : null,
      near, far, penetrationShare: pct(near.length, field.length), penalties: shots.filter((e) => depthOf(e) === '7M'),
      contraGoals: goalsIn(shots.filter(isContra)), blocked: shots.filter((e) => e.result === 'BLOCADO').length + (ours ? state.events.filter(isBlockedTurnover).length : 0),
      goalSector: topCell(goalGrid(shots, 'GOL')), saveSector: topCell(goalGrid(shots, 'PARADA'))
    };
  }
  const laneRows = (a) => a.lanes.map((l) => [l.label, gt(l.near), gt(l.far), gt(l.list), pctText(pct(goalsIn(l.list), l.list.length))]);
  const bestLane = (a, minGoals) => a.lanes.filter((l) => goalsIn(l.list) >= minGoals).sort((x, y) => goalsIn(y.list) - goalsIn(x.list) || x.list.length - y.list.length)[0] || null;
  // Key points as { tone: 'bad' | 'good', text }: what the rival does to us, and how our attack goes.
  function keyPoints() {
    const k = CONFIG.insights;
    const live = liveStats();
    const them = attackAnalysis('them'), us = attackAnalysis('us');
    const defence = [], attack = [];
    const bad = (list, text) => list.push({ tone: 'bad', text });
    const good = (list, text) => list.push({ tone: 'good', text });
    const hurt = bestLane(them, k.minGoals);
    if (hurt) bad(defence, `Más goles encajados por ${hurt.label.toLowerCase()}: ${gt(hurt.list)}.`);
    if (them.field.length >= k.minShots && them.penetrationShare >= k.penetrationShare) bad(defence, `Os penetran: el ${them.penetrationShare}% de sus tiros llega desde 6 m (${gt(them.near)}).`);
    else if (goalsIn(them.far) >= k.minGoals && goalsIn(them.far) >= goalsIn(them.near)) bad(defence, `Os hacen daño desde 9 m (${gt(them.far)}): salir más a sus lanzadores.`);
    if (them.topScorer && them.topScorer.goals >= k.minGoals) bad(defence, `Vigilar a ${them.topScorer.label}: ${plural(them.topScorer.goals, 'gol', 'goles')} en ${plural(them.topScorer.shots, 'tiro', 'tiros')}.`);
    if (them.goalSector && them.goalSector.n >= k.minGoals) bad(defence, `Encajáis sobre todo ${sectorName(them.goalSector.cell)} (${them.goalSector.n} goles).`);
    if (them.contraGoals >= k.minGoals) bad(defence, `${them.contraGoals} goles encajados a la contra: mejorar el repliegue.`);
    if (them.penalties.length >= k.minRepeats) bad(defence, `${them.penalties.length} penaltis en contra (marcan ${goalsIn(them.penalties)}).`);
    const faults = Object.entries(defFaultCounts(state.events)).sort((a, b) => b[1] - a[1])[0];
    if (faults && faults[1] >= k.minRepeats) bad(defence, `Fallo defensivo más repetido: ${faults[0].toLowerCase()} (${faults[1]}).`);
    const gkRate = rate(live.them.savedPct, 'gk');
    if (gkRate === 'r-bad') bad(defence, `Pocas paradas: ${live.them.savedPct}% (objetivo ${CONFIG.targets.gk[0]}%).`);
    if (gkRate === 'r-good') good(defence, `Buen nivel en portería: ${live.them.savedPct}% de paradas.`);

    if (rate(live.us.shooting, 'shooting') === 'r-bad') bad(attack, `Acierto bajo en el tiro: ${live.us.shooting}% (${live.us.goals}/${live.us.shots}).`);
    const weakZone = live.us.zones.filter((z) => z.att >= k.minShots && rate(z.pct, z.id) === 'r-bad').sort((a, b) => a.pct - b.pct)[0];
    if (weakZone) bad(attack, `Poco acierto desde ${ZONES[weakZone.id]}: ${weakZone.GOL}/${weakZone.att}.`);
    if (rate(live.us.turnoverPct, 'turnovers') === 'r-bad') {
      const top = Object.entries(turnoverCounts(state.events)).sort((a, b) => b[1] - a[1])[0];
      bad(attack, `Demasiadas pérdidas: ${live.us.turnovers} en ${live.us.possessions} posesiones${top ? `; la más repetida, ${top[0].toLowerCase()} (${top[1]})` : ''}.`);
    }
    if (us.blocked >= k.minBlocked) bad(attack, `${us.blocked} tiros bloqueados: buscar mejores posiciones de lanzamiento.`);
    if (us.saveSector && us.saveSector.n >= k.minRepeats) bad(attack, `Su portero os para sobre todo ${sectorName(us.saveSector.cell)} (${us.saveSector.n}).`);
    const works = bestLane(us, k.minGoals);
    if (works) good(attack, `Funciona el ataque por ${works.label.toLowerCase()}: ${gt(works.list)}.`);
    if (us.topScorer && us.topScorer.goals >= k.minGoals) good(attack, `Máximo goleador: ${us.topScorer.label}, ${us.topScorer.goals} de ${us.topScorer.shots}.`);
    return { defence, attack };
  }
  function gkCounts(shots) {
    const c = countGroups(shots);
    const pens = countGroups(shots.filter((e) => e.zone === '7M'));
    return { saved: c.PARADA, onTarget: c.GOL + c.PARADA, conceded: c.GOL, missed: c.FALLO, pensSaved: pens.PARADA, pensOnTarget: pens.GOL + pens.PARADA };
  }
  function gkFigures(shots) {
    const k = gkCounts(shots);
    return [
      ['Paradas', pctText(pct(k.saved, k.onTarget)), `${k.saved}/${k.onTarget} a puerta`],
      ['Detenidos', k.saved, ''],
      ['Encajados', k.conceded, ''],
      ['Fuera · palo · bloq.', k.missed, 'sin ir a puerta'],
      ['7 m parados', `${k.pensSaved}/${k.pensOnTarget}`, '']
    ];
  }
  function teamFigures() {
    const s = liveStats();
    const { us, them } = s;
    return [
      ['Tiro', pctText(us.shooting), `${us.goals}/${us.shots} lanzamientos`],
      ['Ataque', pctText(us.attack), `${us.goals}/${us.possessions} posesiones`],
      ['Pérdidas', us.turnovers, `de ${us.possessions} posesiones`],
      ['Paradas', pctText(them.savedPct), `${them.saved}/${them.onTarget} a puerta`],
      ['Defensa', pctText(s.defense), 'ataques rivales sin gol'],
      ['Recuperaciones', s.recov, ''],
      ['Blocajes', s.blocks, `nos bloquean ${us.blocked}`],
      ['Fallos defensivos', s.defFaults, ''],
      ["Exclusiones 2'", `${exclusionEvents().length}–${rivalExclusionEvents().length}`, `${state.us}–${state.them}`]
    ];
  }
  function playerFigures(p, s = state) {
    const stats = playerStats(p.id, s.events);
    const shots = ourShots(s.events).filter((e) => e.playerId === p.id);
    const c = countGroups(shots);
    const faults = DEFENSIVE_FAULTS.reduce((n, k) => n + stats[k], 0);
    const cards = Object.entries(SANCTIONS).filter(([k]) => stats[k]).map(([k, v]) => `${stats[k]} ${v.short}`).join(' · ') || '–';
    return [
      ['Goles', `${c.GOL}/${shots.length}`, shots.length ? `${pctText(pct(c.GOL, shots.length))} de acierto` : 'sin lanzamientos'],
      ['Parados', c.PARADA, 'por el portero rival'],
      ['Fallados', c.FALLO, 'fuera · palo · bloqueado'],
      ['Pases de gol', stats.ASIST, ''],
      ['Provoca 7 m', stats.PROV7, ''],
      ['Recuperaciones', stats.RECUP, ''],
      ['Blocajes', stats.BLOC, ''],
      ['Pérdidas', stats.TURNOVER, ''],
      ['Fallos defensivos', faults, ''],
      ['Sanciones', cards, '']
    ];
  }
  const sanctionRows = () => state.events.filter((e) => e.kind === 'SANCTION' || e.kind === 'RIVAL_SANCTION')
    .map((e) => [absToClock(e.abs), exclusionTargetLabel(e), SANCTIONS[e.card].label]);
  // Score at the end of every 5' block played so far, from the goal times (no manual note needed).
  function scoreCheckRows() {
    const blocks = Math.floor(absSeconds() / CONFIG.scoreIntervalSeconds);
    return Array.from({ length: blocks }, (_, i) => {
      const until = (i + 1) * CONFIG.scoreIntervalSeconds;
      const s = score(state.events.filter((e) => e.abs <= until));
      return [`Min ${until / 60}`, `${s.us}–${s.them}`];
    });
  }

  // ---- Screen rendering ----
  const isZero = (v) => v === 0 || v === '0/0';
  const td = (v) => `<td class="${isZero(v) ? 'zero' : ''}">${esc(v)}</td>`;
  const tableHtml = (head, rows) => `<div class="table-wrap"><table><thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${r.map(td).join('')}</tr>`).join('')}</tbody></table></div>`;
  const figuresHtml = (figures) => `<div class="summary">${figures.map(([label, value, sub]) => `<div class="sum"><strong>${esc(value)}</strong><span>${esc(label)}</span><small>${esc(sub)}</small></div>`).join('')}</div>`;
  const countListHtml = (counts, empty) => (Object.keys(counts).length ? Object.entries(counts).map(([k, v]) => `<li><span>${esc(k)}</span><b>${v}</b></li>`).join('') : `<li>${empty}</li>`);
  const card = (title, inner) => `<div class="sheet-card"><h3>${title}</h3>${inner}</div>`;

  function sheetStatsHtml() {
    const rows = fieldPlayers().map((p) => {
      const [num, name, ...rest] = playerRow(p, state);
      return `<tr><td>${num}</td><td class="name"><span style="background:${posOf(p).color}"></span>${esc(name)}</td>${rest.map(td).join('')}</tr>`;
    }).join('');
    const checks = scoreCheckRows();
    return `${figuresHtml(teamFigures())}
      <div class="table-wrap"><table class="stats-table"><thead><tr>${PLAYER_HEAD.map((h, i) => `<th${i === 1 ? ' style="text-align:left"' : ''}>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
      <div class="sheet-grid">
        ${card("Marcador cada 5'", `<ul>${checks.length ? checks.map(([m, r]) => `<li><span>${m}</span><b>${r}</b></li>`).join('') : '<li>Sin apuntes.</li>'}</ul>`)}
        ${card('Pérdidas por tipo', `<ul>${countListHtml(turnoverCounts(state.events), 'Sin pérdidas.')}</ul>`)}
        ${card('Fallos defensivos', `<ul>${countListHtml(defFaultCounts(state.events), 'Sin fallos.')}</ul>`)}
        ${card('Sanciones', `<ul>${sanctionRows().map(([t, who, what]) => `<li><span>${t} · ${esc(who)}</span><b>${esc(what)}</b></li>`).join('') || '<li>Sin sanciones.</li>'}</ul>`)}
        ${card('Notas', `<ul class="notes">${noteRows().map(([t, text]) => `<li><span>${t}</span><b>${esc(text)}</b></li>`).join('') || '<li>Sin notas.</li>'}</ul>`)}
      </div>`;
  }
  function goalGridHtml(shots, group, title, viewKey = 'GK', colours = MAP_VIEWS[viewKey].colors) {
    const grid = goalGrid(shots, group);
    const max = Math.max(1, ...grid.flat());
    const color = colours[group];
    return card(title, `<div class="goal-grid">${grid.flat().map((n) => `<div style="--c:${color};--a:${((n / max) * 0.8).toFixed(2)}"><b>${n}</b></div>`).join('')}</div><p class="note">Portería vista desde el lanzador.</p>`);
  }
  // Who took a shot: one of our players or a rival dorsal; null when it was logged without one.
  const shooterOf = (e, s = state) => (e.kind === 'SHOT' ? playerById(e.playerId, s) : rivalById(e.rivalId, s)) || null;
  const shooterKey = (e, s = state) => { const shooter = shooterOf(e, s); return shooter ? shooter.id : ''; };
  // Shooters on one goal ranked by the damage they did: goals, then shots, then dorsal; unidentified shots go last.
  function shooterRanking(shots) {
    const groups = new Map();
    shots.forEach((e) => {
      const key = shooterKey(e);
      if (!groups.has(key)) {
        const s = shooterOf(e);
        const ours = e.kind === 'SHOT';
        groups.set(key, { id: key, shooter: s, pos: s && (ours ? posOf(s) : rivalPos(s)), label: s && (ours ? `#${s.num} ${s.name}` : rivalLabel(s)), list: [] });
      }
      groups.get(key).list.push(e);
    });
    return [...groups.values()].map((g) => ({ ...g, goals: goalsIn(g.list) })).sort((a, b) => Number(!a.shooter) - Number(!b.shooter)
      || b.goals - a.goals || b.list.length - a.list.length || (a.shooter && b.shooter ? a.shooter.num - b.shooter.num : 0));
  }
  // Goals are named by whose shots they receive: GK = our goal (rival shots), US = theirs (our shots), as in MAP_VIEWS.
  const UNKNOWN_SHOOTER = { GK: 'Sin dorsal', US: 'Sin jugador' };
  const GOAL_SHOOTER_HEAD = ['Nº', 'Jugador', 'Tiros', 'Goles', 'Parados', 'Fallados', '% gol'];
  function goalShooterRows(shots, viewKey) {
    return shooterRanking(shots).map(({ shooter, list }) => {
      const c = countGroups(list);
      return [shooter ? shooter.num : '–', shooter ? shooter.name || '–' : UNKNOWN_SHOOTER[viewKey], list.length, c.GOL, c.PARADA, c.FALLO, pctText(pct(c.GOL, list.length))];
    });
  }
  // Trajectories with the shooter's dorsal at the release point. With a focused shooter, the other shots fade.
  function shotMapSvg(shots, viewKey, focusId, { s = state, colours = MAP_VIEWS[viewKey].colors } = {}) {
    const focused = (e) => focusId == null || shooterKey(e, s) === focusId;
    const marks = shots.slice().sort((a, b) => Number(focused(a)) - Number(focused(b))).map((e) => {
      const color = colours[groupOf(e.result)];
      const shooter = shooterOf(e, s);
      const { x, y } = e.origin;
      const release = shooter
        ? `<circle cx="${x}" cy="${y}" r="${MAP_DORSAL_R}" fill="${color}" stroke="var(--surface)" stroke-width="3"/><text class="map-dorsal" x="${x}" y="${y}">${shooter.num}</text>`
        : `<circle cx="${x}" cy="${y}" r="9" fill="${color}"/>`;
      return `<g${focused(e) ? '' : ` opacity="${MAP_FADED_OPACITY}"`}>${shotLineSvg(e, color)}${release}</g>`;
    }).join('');
    return `<svg class="shot-map" viewBox="0 0 1000 ${COURT_VIEW_H}" role="img" aria-label="Trayectorias de los lanzamientos con el dorsal de quien lanza">
      ${courtFloorSvg('shot-map-clip')}<rect x="${GOAL_FACE.x}" y="${GOAL_FACE.y}" width="${GOAL_FACE.w}" height="${GOAL_FACE.h}" fill="var(--goal-face)"/>
      ${GOAL_NET_SVG}${GOAL_FRAME_SVG}${marks}</svg>`;
  }
  // Who shot, scored and missed most on one goal (a miss is a shot without a goal); ties keep the ranking order.
  function shooterLeaders(shots) {
    const known = shooterRanking(shots).filter((g) => g.shooter);
    const most = (count) => known.reduce((best, g) => (count(g) > (best ? count(best) : 0) ? g : best), null);
    return { shoots: most((g) => g.list.length), scores: most((g) => g.goals), misses: most((g) => g.list.length - g.goals) };
  }
  function leaderFigures(shots) {
    const { shoots, scores, misses } = shooterLeaders(shots);
    const who = (g, detail) => (g ? [`#${g.shooter.num}`, `${g.shooter.name ? `${g.shooter.name} · ` : ''}${detail(g)}`] : ['–', 'Sin lanzadores identificados']);
    return [
      ['Más lanza', ...who(shoots, (g) => plural(g.list.length, 'tiro', 'tiros'))],
      ['Más marca', ...who(scores, (g) => `${plural(g.goals, 'gol', 'goles')} de ${g.list.length}`)],
      ['Más falla', ...who(misses, (g) => `${g.list.length - g.goals} sin gol de ${g.list.length}`)]
    ];
  }
  function damageListHtml(shots, viewKey) {
    const ranking = shooterRanking(shots);
    if (!ranking.length) return '<p class="note">Sin lanzamientos.</p>';
    const goalColor = MAP_VIEWS[viewKey].colors.GOL;
    return `<div class="damage">${ranking.map((r) => `<button class="dmg press" type="button" data-sheet-shooter="${r.id}" aria-pressed="${ui.sheetShooter === r.id}">
        ${r.shooter ? discHtml(r.shooter, r.pos) : `<span class="disc" style="background:${UNKNOWN_POSITION.color}">?</span>`}
        <span class="who">${esc(r.shooter ? r.shooter.name || `#${r.shooter.num}` : UNKNOWN_SHOOTER[viewKey])}</span>
        <b style="color:${goalColor}">${r.goals}</b><small>${plural(r.list.length, 'tiro', 'tiros')}</small></button>`).join('')}</div>
      <p class="note">Ordenados por goles. Toca un lanzador para ver solo sus tiros.</p>`;
  }
  const MAP_GROUPS = [['PARADA', 'Detenidos'], ['GOL', 'Encajados']];
  function sheetGkHtml() {
    const goal = ui.sheetGoal;
    const ours = goal === 'GK';
    const shots = ours ? gkPool(ui.sheetGk) : ourShots();
    const goals = [['GK', 'Nuestra portería'], ['US', `Portería de ${state.them}`]];
    const keepers = [['', 'Total'], ...goalkeepers().map((g) => [g.id, `#${g.num} ${g.name}`])];
    const chips = (list, attr, current) => `<div class="chips">${list.map(([id, label]) => `<button class="chip press" type="button" ${attr}="${id}" aria-pressed="${current === id}">${esc(label)}</button>`).join('')}</div>`;
    const shooters = ours ? state.them : state.us;
    return `${chips(goals, 'data-sheet-goal', goal)}
      ${ours ? chips(keepers, 'data-sheet-gk', ui.sheetGk || '') : ''}
      ${figuresHtml(gkFigures(shots))}
      <h3 class="acta-h">Lanzadores de ${esc(shooters)}</h3>
      ${figuresHtml(leaderFigures(shots))}
      <div class="map-row">${MAP_GROUPS.map(([group, title]) => { const list = shots.filter((e) => groupOf(e.result) === group); return card(`${title} · ${list.length}`, shotMapSvg(list, goal, ui.sheetShooter)); }).join('')}
        ${card('Quién hace más daño', damageListHtml(shots, goal))}</div>
      ${tableHtml(GK_ZONE_HEAD, gkZoneRows(shots))}
      <div class="sheet-grid">${goalGridHtml(shots, 'PARADA', 'Detenidos por zona de portería', goal)}${goalGridHtml(shots, 'GOL', 'Encajados por zona de portería', goal)}</div>
      ${tableHtml(GOAL_SHOOTER_HEAD, goalShooterRows(shots, goal))}`;
  }
  function rosterLock(p) {
    if (p.id === state.gkId) return 'En portería';
    if (state.events.some((e) => e.playerId === p.id || e.gkId === p.id)) return 'Con acciones';
    return '';
  }
  const posButtons = (p, attr = 'data-roster-pos') => Object.entries(CONFIG.positions).map(([k, info]) => `<button class="pos-btn press${info.darkText ? ' dark' : ''}" type="button" style="--c:${info.color}" ${attr}="${p.id}:${k}" aria-pressed="${p.pos === k}" aria-label="${info.label}">${k}</button>`).join('');
  // Rival dorsal editing, shared by the match acta (prefix "rival") and the profile's template editor (prefix "tpl").
  function rivalTableHtml(list, prefix, lockOf) {
    const rows = list.slice().sort((a, b) => a.num - b.num).map((r) => `<tr>
        <td><input class="in num" type="number" inputmode="numeric" min="${DORSAL_RANGE[0]}" max="${DORSAL_RANGE[1]}" value="${r.num}" data-${prefix}-num="${r.id}" aria-label="Dorsal rival ${r.num}"></td>
        <td><input class="in" type="text" maxlength="${MAX_NAME_LENGTH}" value="${esc(r.name)}" placeholder="Opcional" data-${prefix}-name="${r.id}" aria-label="Nombre del dorsal rival ${r.num}"></td>
        <td><div class="pos-pick">${posButtons(r, `data-${prefix}-pos`)}</div></td>
        <td>${lockOf(r) ? '<small class="note">Con jugadas</small>' : `<button class="btn press" type="button" data-${prefix}-del="${r.id}" aria-label="Quitar el dorsal rival ${r.num}">✕</button>`}</td></tr>`).join('');
    return `<div class="table-wrap"><table><thead><tr><th>Dorsal</th><th style="text-align:left">Nombre</th><th style="text-align:left">Puesto</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  const rivalAddHtml = (prefix) => `<div class="row-actions rival-new">
      <input class="in dorsals" type="text" inputmode="numeric" placeholder="Dorsal (o varios: 4 7 9)" id="${prefix}-dorsals" aria-label="Dorsal o dorsales rivales separados por espacios">

  // ---- Roster edits (configuration, saved at once; not part of the match undo history) ----

  // "4 7, 9" → adds dorsals 4, 7 and 9 to `list`; returns the status text and whether all went in, or an `error`.

  function addDorsals(list, raw, rawName = '', pos = null) {
    const nums = raw.split(/[^0-9]+/).filter(Boolean).map(Number);
    const name = rawName.trim().slice(0, MAX_NAME_LENGTH);
    if (!nums.length) return { error: 'Escribe uno o más dorsales separados por espacios.' };

    const status = (value, key) => ({ 'r-good': ['good', '▲', 'en objetivo'], 'r-warn': ['warn', '●', 'mejorable'], 'r-bad': ['bad', '▼', 'por debajo'], 'r-none': ['none', '', ''] })[rate(value, key)];
    const statusChip = (value, key) => { const [cls, icon, text] = status(value, key); return cls === 'none' ? '' : `<span class="st st-${cls}">${icon} ${text}</span>`; };
    const legend = `<span class="lg"><i style="background:${C.us}"></i>${esc(s.us)}</span><span class="lg"><i style="background:${C.them}"></i>${esc(s.them)}</span>`;
    const points = (v) => signedText(roundHalfUp(v, CONFIG.rating.decimals));

    // ---- KPI cards: the final value, the one at half-time, the target bullet and the rival ----
    function bullet(value, key) {
      if (value == null) return '';
      const [good, poor, dir] = CONFIG.targets[key];
      const max = dir === 'lower' ? Math.max(40, value) : PERCENT;
      const x = (v) => `${(Math.min(v, max) / max) * PERCENT}%`;
      const band = (from, to, colour) => `<i style="left:${from};${to ? `width:calc(${to} - ${from})` : 'right:0'};background:${colour}"></i>`;
      const bands = dir === 'lower'
        ? band('0%', x(good), C.bandGood) + band(x(good), x(poor), C.bandWarn) + band(x(poor), null, C.bandBad)
        : band('0%', x(poor), C.bandBad) + band(x(poor), x(good), C.bandWarn) + band(x(good), null, C.bandGood);
      return `<div class="bullet">${bands}<b style="width:${x(value)}"></b><em style="left:${x(good)}"></em></div>`;
    }
    function kpiCard({ label, value, unit = '', key = null, detail, rival = null, atHalf, lower = false }) {
      const delta = typeof value === 'number' && typeof atHalf === 'number' ? value - atHalf : null;
      const better = !delta ? null : (delta > 0) !== lower;
      const split = atHalf == null ? '' : `<div class="kpi-ht"><span>Descanso <b>${esc(atHalf)}${unit}</b></span><i class="${better == null ? '' : better ? 'up' : 'down'}">${better == null ? '→' : better ? '▲' : '▼'}</i><span>Final <b>${value == null ? '–' : esc(value)}${unit}</b></span></div>`;
      const numeric = typeof value === 'number' ? value : null;
      return `<div class="kpi"><div class="kpi-label">${esc(label)}</div><div class="kpi-value">${value == null ? '–' : esc(value)}<small>${unit}</small></div>${split}
        ${key ? bullet(numeric, key) : ''}<div class="kpi-detail">${esc(detail)}</div>
        <div class="kpi-foot">${key ? statusChip(numeric, key) : ''}${rival ? `<span class="rv">Rival ${esc(rival)}</span>` : ''}</div></div>`;
    }
    const htSt = halves[0].st, inFirst = (list) => list.filter(firstHalf).length;
    const kpis = [
      { label: 'Acierto en el tiro', value: us.shooting, unit: '%', key: 'shooting', detail: `${us.goals} goles de ${us.shots} tiros`, rival: pctText(them.shooting), atHalf: htSt.us.shooting },
      { label: 'Eficacia en ataque', value: us.attack, unit: '%', key: 'attack', detail: `${us.goals} goles en ${us.possessions} posesiones`, rival: pctText(them.attack), atHalf: htSt.us.attack },
      { label: 'Paradas', value: them.savedPct, unit: '%', key: 'gk', detail: `${them.saved} de ${them.onTarget} a puerta`, rival: pctText(us.savedPct), atHalf: htSt.them.savedPct },
      { label: 'Defensa', value: total.defense, unit: '%', key: 'defense', detail: 'ataques rivales sin gol', atHalf: htSt.defense },
      { label: 'Pérdidas', value: us.turnoverPct, unit: '%', key: 'turnovers', detail: `${us.turnovers} en ${us.possessions} posesiones`, atHalf: htSt.us.turnoverPct, lower: true },
      { label: "Exclusiones 2'", value: `${exclusionEvents().length}–${rivalExclusionEvents().length}`, detail: `${s.us} – ${s.them}`, atHalf: `${inFirst(exclusionEvents())}–${inFirst(rivalExclusionEvents())}` }
    ].map(kpiCard).join('');

    // ---- Score charts: each team's goals, the difference, the 5' partials ----
    // Every goal, including the ones entered only as a score fix, as { abs, us, d }.
    const goals = s.events.filter((e) => ((e.kind === 'SHOT' || e.kind === 'RIVAL_SHOT') && e.result === 'GOL') || e.kind === 'SCORE_FIX')
      .map((e) => (e.kind === 'SCORE_FIX' ? { abs: e.abs, us: e.team === 'us', d: e.delta } : { abs: e.abs, us: e.kind === 'SHOT', d: 1 })).sort((a, b) => a.abs - b.abs);
    const end = Math.max(2 * half, ...s.events.map((e) => e.abs));
    const minuteTicks = (X, y) => Array.from({ length: Math.floor(end / SECONDS_PER_MINUTE / 5) + 1 }, (_, i) => `<text x="${X(i * 5 * SECONDS_PER_MINUTE)}" y="${y}" class="ax" text-anchor="middle">${i * 5}'</text>`).join('');
    const breakLine = (X, top, bottom, label, labelY) => `<line x1="${X(half)}" x2="${X(half)}" y1="${top}" y2="${bottom}" stroke="${C.faint}" stroke-dasharray="4 4"/><text x="${X(half) + 6}" y="${labelY}" class="ax">${label}</text>`;
    function runningSvg() {
      const W = 1000, H = 250, left = 40, right = 70, top = 14, bottom = 26, most = Math.max(4, sc.us, sc.them);
      const X = (t) => left + (t / end) * (W - left - right), Y = (g) => top + (1 - g / most) * (H - top - bottom);
      const path = (ours) => {
        let g = 0, d = `M${X(0)},${Y(0)}`;
        goals.filter((x) => x.us === ours).forEach((x) => { d += `L${X(x.abs).toFixed(1)},${Y(g)}`; g += x.d; d += `L${X(x.abs).toFixed(1)},${Y(g).toFixed(1)}`; });
        return `${d}L${X(end)},${Y(g)}`;
      };
      const grid = Array.from({ length: Math.floor(most / 5) + 1 }, (_, i) => i * 5).map((g) => `<line x1="${left}" x2="${W - right}" y1="${Y(g)}" y2="${Y(g)}" stroke="${C.grid}"/><text x="${left - 8}" y="${Y(g) + 4}" class="ax" text-anchor="end">${g}</text>`).join('');
      const apart = sc.us === sc.them ? 9 : 0, endLabel = (g, colour, dy) => `<text x="${X(end) + 8}" y="${Y(g) + 5 + dy}" class="lead" fill="${colour}">${g}</text>`;
      return `<svg viewBox="0 0 ${W} ${H}" class="chart">${grid}${breakLine(X, top, H - bottom, `Descanso ${ht.us}–${ht.them}`, top + 12)}
        <path d="${path(false)}" fill="none" stroke="${C.them}" stroke-width="3" stroke-linejoin="round"/><path d="${path(true)}" fill="none" stroke="${C.us}" stroke-width="3" stroke-linejoin="round"/>
        ${endLabel(sc.us, C.us, -apart)}${endLabel(sc.them, C.them, apart)}${minuteTicks(X, H - 6)}</svg>`;
    }
    function differenceSvg() {
      const W = 1000, H = 210, left = 40, right = 16, top = 16, bottom = 28;
      let diff = 0, widest = 1;
      const pts = [[0, 0]];
      goals.forEach((g) => { pts.push([g.abs, diff]); diff += g.us ? g.d : -g.d; pts.push([g.abs, diff]); widest = Math.max(widest, Math.abs(diff)); });
      pts.push([end, diff]);
      const lim = Math.max(3, widest + 1);
      const X = (t) => left + (t / end) * (W - left - right), Y = (d) => top + ((lim - d) / (2 * lim)) * (H - top - bottom);
      const line = pts.map(([t, d], i) => `${i ? 'L' : 'M'}${X(t).toFixed(1)},${Y(d).toFixed(1)}`).join('');
      const area = (ahead) => `<clipPath id="rp-${ahead ? 'ahead' : 'behind'}"><rect x="0" y="${ahead ? 0 : Y(0)}" width="${W}" height="${ahead ? Y(0) : H}"/></clipPath>
        <path d="${line}L${X(end)},${Y(0)}L${X(0)},${Y(0)}Z" fill="${ahead ? C.us : C.them}" opacity=".16" clip-path="url(#rp-${ahead ? 'ahead' : 'behind'})"/>`;
      const grid = [];
      for (let d = -lim + (lim % 2); d <= lim; d += 2) grid.push(`<line x1="${left}" x2="${W - right}" y1="${Y(d)}" y2="${Y(d)}" stroke="${d ? C.grid : C.axis}" stroke-width="${d ? 1 : 1.5}"/><text x="${left - 8}" y="${Y(d) + 4}" class="ax" text-anchor="end">${d > 0 ? '+' : ''}${d}</text>`);
      const exclusions = [...exclusionEvents().map((e) => [e, C.us]), ...rivalExclusionEvents().map((e) => [e, C.them])]
        .map(([e, colour]) => `<rect x="${X(e.abs) - 5}" y="${top - 2}" width="10" height="12" rx="2" fill="${colour}"/><text x="${X(e.abs)}" y="${top + 7}" class="exl">2'</text>`).join('');
      return `<svg viewBox="0 0 ${W} ${H}" class="chart">${grid.join('')}${area(true)}${area(false)}${breakLine(X, top, H - bottom, `Descanso ${ht.us}–${ht.them}`, H - bottom - 6)}
        <path d="${line}" fill="none" stroke="${C.ink}" stroke-width="2"/>${minuteTicks(X, H - 8)}${exclusions}
        <text x="${left + 6}" y="${top + 26}" class="lead" fill="${C.us}">▲ Gana ${esc(s.us)}</text><text x="${left + 6}" y="${H - bottom - 8}" class="lead" fill="${C.them}">▼ Gana ${esc(s.them)}</text></svg>`;
    }
    const blocks = Array.from({ length: Math.ceil(end / block) }, (_, i) => {
      const from = i * block, to = (i + 1) * block, last = to >= end, inside = (abs) => abs >= from && (abs < to || (last && abs <= to));
      const mine = goals.filter((g) => inside(g.abs));
      return { label: `${from / SECONDS_PER_MINUTE}-${to / SECONDS_PER_MINUTE}'`, us: sumOf(mine.filter((g) => g.us), (g) => g.d), them: sumOf(mine.filter((g) => !g.us), (g) => g.d),
        run: score(s.events.filter((e) => e.abs < to || (last && e.abs <= to))) };
    });
    function partialsSvg() {
      const W = 1000, H = 200, left = 56, top = 22, mid = 100, unit = 13, width = (W - left - 16) / blocks.length;
      const cells = blocks.map((b, i) => {
        const x = left + i * width, cx = x + width / 2, w = width * 0.34, diff = b.us - b.them;
        const winner = diff > 0 ? C.us : diff < 0 ? C.them : C.faint;
        return `${i === blocks.length / 2 ? `<line x1="${x}" x2="${x}" y1="${top - 14}" y2="${H - 6}" stroke="${C.faint}" stroke-dasharray="4 4"/>` : ''}
          <rect x="${cx - w - 2}" y="${mid - b.us * unit}" width="${w}" height="${b.us * unit}" rx="3" fill="${C.us}"/><rect x="${cx + 2}" y="${mid - b.them * unit}" width="${w}" height="${b.them * unit}" rx="3" fill="${C.them}"/>
          <text x="${cx - w / 2 - 2}" y="${mid - b.us * unit - 5}" class="val" text-anchor="middle">${b.us}</text><text x="${cx + w / 2 + 2}" y="${mid - b.them * unit - 5}" class="val" text-anchor="middle">${b.them}</text>
          <text x="${cx}" y="${mid + 18}" class="ax" text-anchor="middle">${b.label}</text><rect x="${cx - 26}" y="${mid + 28}" width="52" height="22" rx="11" fill="${winner}" opacity=".14"/>
          <text x="${cx}" y="${mid + 43}" class="part" text-anchor="middle" fill="${diff ? winner : C.muted}">${diff > 0 ? '+' : ''}${diff}</text><text x="${cx}" y="${mid + 70}" class="run" text-anchor="middle">${b.run.us}–${b.run.them}</text>`;
      }).join('');
      return `<svg viewBox="0 0 ${W} ${H}" class="chart"><line x1="${left}" x2="${W - 16}" y1="${mid}" y2="${mid}" stroke="${C.axis}"/><text x="0" y="${mid + 43}" class="ax">Parcial</text><text x="0" y="${mid + 70}" class="ax">Marcador</text>${cells}</svg>`;
    }

    // ---- Halves: the same indicators per half, the change and its direction ----
    const zoneOf = (side, id) => side.zones.find((z) => z.id === id);
    const zoneRow = (label, id) => [label, (h) => zoneOf(h.st.us, id).pct, id, (h) => `${zoneOf(h.st.us, id).GOL}/${zoneOf(h.st.us, id).att}`, 'sub'];
    const halfRows = [
      ['Goles', (h) => h.sc.us], ['Goles encajados', (h) => h.sc.them, null, null, 'count-lower'],
      ['Acierto en el tiro', (h) => h.st.us.shooting, 'shooting', (h) => `${h.st.us.goals}/${h.st.us.shots}`],
      zoneRow('desde 6 m', '6M'), zoneRow('desde 9 m', '9M'), zoneRow('penaltis (7 m)', '7M'),
      ['Eficacia en ataque', (h) => h.st.us.attack, 'attack', (h) => `${h.st.us.goals}/${h.st.us.possessions}`],
      ['Pérdidas', (h) => h.st.us.turnoverPct, 'turnovers', (h) => `${h.st.us.turnovers}/${h.st.us.possessions}`],
      ['Paradas', (h) => h.st.them.savedPct, 'gk', (h) => `${h.st.them.saved}/${h.st.them.onTarget}`],
      ['Defensa', (h) => h.st.defense, 'defense', (h) => `${h.st.them.possessions - h.st.them.goals}/${h.st.them.possessions}`],
      ['Acierto del rival', (h) => h.st.them.shooting, null, (h) => `${h.st.them.goals}/${h.st.them.shots}`, 'pct-lower']
    ];
    const isPct = (key, kind) => Boolean(key) || kind === 'pct-lower';
    function halvesTable() {
      const cell = (h, [, get, key, detail, kind]) => {
        const v = get(h), [cls] = key ? status(v, key) : ['none'];
        return `<td class="hv"><span class="dot dot-${cls}"></span><b>${v == null ? '–' : v}${isPct(key, kind) && v != null ? '%' : ''}</b>${detail ? `<small>${detail(h)}</small>` : ''}</td>`;
      };
      const change = ([, get, key, , kind]) => {
        const a = get(halves[0]), b = get(halves[1]);
        if (a == null || b == null) return '<td></td>';
        const d = b - a, lower = (key && CONFIG.targets[key][2] === 'lower') || (kind || '').endsWith('lower'), better = d === 0 ? null : (d > 0) !== lower;
        return `<td class="dl ${better == null ? '' : better ? 'up' : 'down'}">${d > 0 ? '+' : ''}${d}${isPct(key, kind) ? PCT_POINTS : ''} ${better == null ? '=' : better ? '▲' : '▼'}</td>`;
      };
      return `<table class="halves"><thead><tr><th></th>${halves.map((h) => `<th>${h.label}</th>`).join('')}<th>2ª vs 1ª</th></tr></thead>
        <tbody>${halfRows.map((r) => `<tr class="${r[4] === 'sub' ? 'sub' : ''}"><td class="rl">${r[4] === 'sub' ? '· ' : ''}${r[0]}</td>${halves.map((h) => cell(h, r)).join('')}${change(r)}</tr>`).join('')}</tbody></table>`;
    }

    // ---- Head to head and shooting by situation ----
    const penaltiesOf = (list) => list.filter((e) => e.zone === '7M');
    const fastBreakGoals = (ours) => goalsIn(ours ? ourShots().filter((e) => e.zone === ZONE_CONTRA) : rivalShots().filter((e) => e.contra));
    function headToHead() {
      const pens = [penaltiesOf(ourShots()), penaltiesOf(rivalShots())];
      const rows = [['Lanzamientos', us.shots, them.shots], ['Goles', us.goals, them.goals], ['Paradas del portero', them.saved, us.saved],
        ['Pérdidas', us.turnovers, them.turnovers], ['Goles de contraataque', fastBreakGoals(true), fastBreakGoals(false)],
        ['Penaltis lanzados', pens[0].length, pens[1].length, gt(pens[0]), gt(pens[1])], ["Exclusiones 2'", exclusionEvents().length, rivalExclusionEvents().length]];
      return `<div class="duel"><div class="duel-head"><span style="color:${C.us}">${esc(s.us)}</span><span></span><span style="color:${C.them}">${esc(s.them)}</span></div>
        ${rows.map(([label, a, b, textA, textB]) => { const most = Math.max(a, b, 1); return `<div class="drow"><span class="dv">${textA || a}</span><div class="dbar l"><i style="width:${(a / most) * PERCENT}%;background:${C.us}"></i></div>
          <span class="dlabel">${label}</span><div class="dbar r"><i style="width:${(b / most) * PERCENT}%;background:${C.them}"></i></div><span class="dv">${textB || b}</span></div>`; }).join('')}</div>`;
    }
    function shootingRadarSvg() {
      const axes = [['Tiro total', (st) => st.shooting], ['Desde 6 m', (st) => zoneOf(st, '6M').pct], ['Desde 9 m', (st) => zoneOf(st, '9M').pct],
        ['Penaltis', (st) => zoneOf(st, '7M').pct], ['Contraataque', (st) => zoneOf(st, ZONE_CONTRA).pct], ['Eficacia ataque', (st) => st.attack]];
      const S = 340, c = S / 2, rad = 112;
      const at = (i, f) => { const a = -Math.PI / 2 + (2 * Math.PI * i) / axes.length; return [c + Math.cos(a) * rad * f, c + Math.sin(a) * rad * f]; };
      const rings = [0.25, 0.5, 0.75, 1].map((f) => `<polygon points="${axes.map((_, i) => at(i, f).join(',')).join(' ')}" fill="none" stroke="${C.grid}"/>`).join('');
      const spokes = axes.map((_, i) => `<line x1="${c}" y1="${c}" x2="${at(i, 1)[0]}" y2="${at(i, 1)[1]}" stroke="${C.grid}"/>`).join('');
      const shape = (st, colour) => `<polygon points="${axes.map(([, get], i) => at(i, (get(st) || 0) / PERCENT).join(',')).join(' ')}" fill="${colour}" fill-opacity=".14" stroke="${colour}" stroke-width="2" stroke-linejoin="round"/>
        ${axes.map(([, get], i) => { const [x, y] = at(i, (get(st) || 0) / PERCENT); return `<circle cx="${x}" cy="${y}" r="4" fill="${colour}" stroke="#fff" stroke-width="2"/>`; }).join('')}`;
      const labels = axes.map(([name, get], i) => { const [x, y] = at(i, 1.3); return `<text x="${x}" y="${y - 6}" class="rl2" text-anchor="middle">${name}</text>
        <text x="${x}" y="${y + 9}" class="rv2" text-anchor="middle"><tspan fill="${C.us}">${pctText(get(us))}</tspan> · <tspan fill="${C.them}">${pctText(get(them))}</tspan></text>`; }).join('');
      return `<svg viewBox="-40 -10 ${S + 80} ${S + 20}" class="radar">${rings}${spokes}${shape(them, C.them)}${shape(us, C.us)}${labels}<text x="${c + 4}" y="${c - rad / 2 - 2}" class="ax">50%</text><text x="${c + 4}" y="${c - rad - 2}" class="ax">100%</text></svg>`;
    }

    // ---- Shots: two goal drawings per team (in / not in), the zones and where the goals and saves went ----
    function goalFaceGrid(shots, group, colour, title) {
      const grid = goalGrid(shots, group), onFace = Array.from({ length: GOAL_GRID }, () => Array(GOAL_GRID).fill(0)), most = Math.max(1, ...grid.flat());
      shots.filter((e) => groupOf(e.result) !== 'FALLO' && inGoalFace(e.target)).forEach((e) => { const [r, c] = goalCell(e.target); onFace[r][c]++; });
      const cell = (n, r, c) => `<div style="background:${n ? mixWithWhite(colour, (20 + (n / most) * 70) / PERCENT) : C.soft};color:${n / most > 0.55 ? '#fff' : C.ink}"><b>${n}</b><small>${onFace[r][c] ? `de ${onFace[r][c]}` : ''}</small></div>`;
      return `<div class="heat"><div class="heat-t">${title}</div><div class="heat-g">${grid.map((row, r) => row.map((n, c) => cell(n, r, c)).join('')).join('')}</div></div>`;
    }
    const zoneBars = (st, colour) => `<div class="zbars">${st.zones.filter((z) => z.att).map((z) => `<div class="zb"><span>${ZONES[z.id]}</span><div class="zt"><i style="width:${z.pct}%;background:${colour}"></i></div><span><b>${z.pct}%</b> ${z.GOL}/${z.att}</span></div>`).join('')}</div>`;
    function shotPanel(title, shots, viewKey, st, colour, savedTitle) {
      const c = countGroups(shots), mapColours = MAP_VIEWS[viewKey].colors, ours = viewKey === 'US';
      const drawing = (list, caption, keys) => `<figure class="goalmap"><figcaption>${caption}</figcaption>${shotMapSvg(list, viewKey, null)}
        <div class="mlg">${keys.map(([k, label]) => `<span><i style="background:${mapColours[k]}"></i>${label} <b>${c[k]}</b></span>`).join('')}</div></figure>`;
      const scored = shots.filter((e) => groupOf(e.result) === 'GOL'), notIn = shots.filter((e) => groupOf(e.result) !== 'GOL');
      return `<section class="shots"><h3 style="border-color:${colour}">${title}<span>${st.goals}/${st.shots} · ${pctText(st.shooting)}</span></h3>
        <div class="maps2">${drawing(scored, `${ours ? 'Goles marcados' : 'Goles encajados'} · ${c.GOL}`, [['GOL', ours ? 'Gol' : 'Gol encajado']])}
          ${drawing(notIn, `${ours ? 'Parados y fuera' : 'Paradas y fuera'} · ${c.PARADA + c.FALLO}`, [['PARADA', ours ? 'Parado' : 'Parada nuestra'], ['FALLO', ours ? 'Fuera / palo / bloqueado' : 'Fuera / palo']])}</div>
        <div class="side3">${zoneBars(st, colour)}${goalFaceGrid(shots, 'GOL', ours ? C.goal : C.bad, ours ? 'Dónde marcamos' : 'Dónde nos marcan')}${goalFaceGrid(shots, 'PARADA', C.save, savedTitle)}</div></section>`;
    }

    // ---- Ratings: the v5 points, where they come from, the key moments and the keepers ----
    const seconds = minutesOnCourt(s), ratings = matchRatings(s), weights = ratingWeights();
    const played = (p) => (seconds && seconds.get(p.id)) || eventsOf(p.id).length;
    const ranked = rankedByRating(s, ratings, seconds).filter(played), mvp = matchMvp(s, ratings, seconds);
    const widest = Math.max(4, ...ranked.map((p) => Math.abs(ratingValue(ratings, p) ?? 0)));
    const minutesOf = (p) => (seconds ? minutesText(seconds.get(p.id) || 0) : '–');
    function keyMomentsList() {
      const keepers = new Set(goalkeepers().map((g) => g.id)), all = ranked.flatMap((p) => ratings.get(p.id).moments).filter((x) => x.factor > 1);
      const big = (x) => Math.abs(x.value * POINTS_PER_GOAL) >= REPORT_KEY_MOMENT_MIN_POINTS;
      const field = all.filter((x) => !keepers.has(x.id) && big(x)).sort((a, b) => Math.abs(b.value) - Math.abs(a.value)).slice(0, REPORT_KEY_MOMENTS_FIELD);
      const keeper = all.filter((x) => keepers.has(x.id) && x.label !== 'Inicia contraataque');
      const moments = [...field, ...keeper].sort((a, b) => a.abs - b.abs);
      if (!moments.length) return '<p class="none">Sin momentos decisivos: el partido no llegó ajustado al final.</p>';
      return `<ul class="kms">${moments.map((x) => { const v = x.value * POINTS_PER_GOAL; return `<li><span class="kt">${Math.floor(x.abs / SECONDS_PER_MINUTE)}'</span><span class="ks">${x.score.us}–${x.score.them}</span><b>${esc(playerById(x.id, s).name)}</b><span class="kl">${esc(x.label)} ×${decimalText(x.factor)}</span><span class="${v > 0 ? 'pos-v' : 'neg-v'}">${points(v)}</span></li>`; }).join('')}</ul>`;
    }
    function ratingRows() {
      return ranked.map((p) => {
        const r = ratings.get(p.id), value = r.value, colour = bandColour(value), o = outcomeOf(s, p), keeper = p.pos === 'POR';
        const w = value == null ? 0 : (Math.abs(value) / widest) * 50;
        const part = (v) => `<td class="${Math.abs(v) < RATING_LINE_MIN_POINTS ? 'z' : v > 0 ? 'pos-v' : 'neg-v'}">${Math.abs(v) < RATING_LINE_MIN_POINTS ? '·' : points(v)}</td>`;
        const defence = (v) => (Math.abs(v) < RATING_LINE_MIN_POINTS ? part(v) : `<td class="${v > 0 ? 'pos-v' : 'neg-v'}">${points(v)}<small class="hh">${r.defenceHalves.map(points).join(' / ')}</small></td>`);
        return `<tr><td class="num"><span class="pos" style="background:${posOf(p).color}"></span>${p.num}</td><td class="nm">${esc(p.name)}${keeper ? ' <small>POR</small>' : ''}</td>

          <td class="bd" style="color:${colour}">${esc(ratingBandLabel(value))}</td><td>${minutesOf(p)}'</td><td class="strong">${o.made}/${o.tried}<small>${o.tried ? ` ${pct(o.made, o.tried)}%` : ''}</small></td>
          ${RATING_LINES.map((l) => (l.key === 'defUnit' && !keeper && r.possessions.defence ? defence(r.lines.defUnit) : part(r.lines[l.key]))).join('')}</tr>`;

    function keeperCards() {
      return goalkeepers().filter(played).map((g) => {
        const shots = gkShots(g.id), k = gkCounts(shots), p = pct(k.saved, k.onTarget), ring = ({ 'r-good': C.good, 'r-warn': C.warn, 'r-bad': C.bad })[rate(p, 'gk')] || C.faint;
        const R2 = 34, around = 2 * Math.PI * R2;
        const zone = (id, label) => { const z = gkCounts(shots.filter((e) => gkZoneOf(e) === id)); return z.onTarget ? `<li><span>${label}</span><b>${z.saved}/${z.onTarget}</b></li>` : ''; };
        return `<div class="gk"><div class="gk-top"><svg viewBox="0 0 84 84" class="ring"><circle cx="42" cy="42" r="${R2}" fill="none" stroke="${C.grid}" stroke-width="9"/><circle cx="42" cy="42" r="${R2}" fill="none" stroke="${ring}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${((p || 0) / PERCENT) * around} ${around}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" class="ring-t">${pctText(p)}</text></svg>
          <div><div class="gk-name">#${g.num} ${esc(g.name)}</div><div class="gk-sub">${minutesOf(g)}' en pista · ${k.saved} paradas · ${k.conceded} goles</div>${statusChip(p, 'gk')}</div></div>

    // The scale, worked out from the current weights so the note never drifts from the numbers.
    function modelNote() {
      // Up to two decimals, the trailing zeros dropped (0,45 · 1,5 · 2).
      const exact = (v) => String(roundHalfUp(v, 2)).replace('.', ',');
      const r = CONFIG.rating, b = r.possession, pts = (v) => exact(Math.abs(v) * POINTS_PER_GOAL), sign = (v) => `${v < 0 ? '−' : '+'}${pts(v)}`;
      const shot = (z) => { const p = preShotGoal(z), creation = z === '7M' ? 0 : r.shooterCreationShare * (p - b); return `${ZONES[z]}: gol ${sign(1 - p + creation)}, fallo ${sign(-p + creation)}`; };
      const kw = weights.keeperWeight;
      return `<div class="model"><b>Cómo se puntúa.</b> Cada posesión vale lo que acabó dando (gol o no) menos lo que da una posesión media (${exact(b)} goles). Ese valor se reparte una sola vez: primero a quien la decide y lo que sobra entre los que estaban en pista. 1 gol aportado = ${POINTS_PER_GOAL} puntos.
        <b>Tiro:</b> ${['6M', '9M', '7M'].map(shot).join(' · ')} (con la mitad de la ocasión creada). <b>Creación:</b> 7 m provocado ${sign(weights.oneOnOne)}, asistencia ${sign(weights.assist)}, iniciar un contraataque ${sign(weights.starter)}.
        <b>Balón:</b> pérdida ${sign(-b)} (de reglamento ${sign(-(b - weights.ruleFaultDiscount))}; más si acaba en contraataque rival). <b>Def. individual:</b> recuperación ${sign(b)}, blocaje ${sign(weights.blocRetained)}, 7 m cometido y 1x1 superado ${sign(-weights.oneOnOne)}.
        <b>Def. en pista:</b> lo que el rival consigue tirar a puerta mientras defiendes (lo que pasa después es cosa del portero), repartido entre los que estáis en pista. <b>Atq. en pista:</b> igual con nuestras posesiones.
        <b>Portería:</b> goles evitados frente a lo esperable, al ${Math.round(kw * PERCENT)}% (parar en 6 m ${sign(r.pOn['6M'] * kw)}, encajar ${sign(-(1 - r.pOn['6M']) * kw)}; parar un 7 m ${sign(r.pOn['7M'] * kw)}).
        <b>Disciplina:</b> el 2' cuesta lo que se perdió con uno menos; roja: eso, la conducta y el resto del partido sin el jugador. <b>Momento decisivo:</b> desde el ${r.context.closeFrom / SECONDS_PER_MINUTE}' con ±${r.context.closeMargin} goles cada acción vale ×${exact(weights.closeFactor)}; desde el ${r.context.lateFrom / SECONDS_PER_MINUTE}' con ±${r.context.lateMargin} ×${exact(weights.lateFactor)}; para bien y para mal.
        <b>Resultado:</b> ±${pts(weights.result)} según la parte del partido jugada.
        <span class="bands"><b>Valoración:</b> ${CONFIG.rating.bands.map(([from, label]) => `<span><i style="background:${bandColour(from === -Infinity ? -100 : from)}"></i>${label}${from > -Infinity ? ` ≥ ${signedText(from)}` : ''}</span>`).join('')}</span></div>`;
    }

    // ---- The full tables at the end ----
    function fullStatsTable() {
      const rows = [...fieldPlayers(), ...goalkeepers()].filter(played).map((p) => playerRow(p, s));
      const sumColumn = (i) => {
        const cells = rows.map((r) => String(r[i]));
        if (cells.every((c) => /^\d+\/\d+$/.test(c))) return cells.reduce(([g, t], c) => { const [x, y] = c.split('/').map(Number); return [g + x, t + y]; }, [0, 0]).join('/');
        return cells.every((c) => /^\d+$/.test(c)) ? sumOf(cells, Number) : '';
      };
      const totals = PLAYER_HEAD.map((h, i) => (i === 1 ? 'Equipo' : i === 0 || ['Min', '+/−'].includes(h) ? '' : sumColumn(i)));
      const cell = (v, i) => { const t = String(v); return `<td class="${i === 1 ? 'nm' : ''}${t === '0' || t === '0/0' ? ' z' : ''}">${esc(t)}</td>`; };
      return `<table class="players full"><thead><tr>${PLAYER_HEAD.map((h, i) => `<th class="${i === 1 ? 'nm' : ''}">${esc(h)}</th>`).join('')}</tr></thead>

    const titled = (title, html) => `<div><h4>${title}</h4>${html}</div>`;
    const countRowsOrNone = (counts) => (Object.keys(counts).length ? Object.entries(counts) : [['Ninguno', '']]);

    // ---- Pages ----

    const page = (n, title, body) => `<div class="page">${header(title)}<main>${body}</main><footer><span>HBStats · ${esc(first.name)} – ${esc(second.name)}</span><span>${n} / ${REPORT_PAGES}</span></footer></div>`;
    const pages = [
      page(1, 'Informe del partido', `<div class="kpis">${kpis}</div>

      page(2, 'Primera parte frente a segunda', `<div class="row"><div class="col grow">

  // ---- Device storage ----
  function readJson(key) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.warn(`${key} could not be read on this device.`, err); return null; }
  }
  function writeJson(key, value) {

  }

    try { localStorage.removeItem(key); } catch (err) { console.warn(`${key} could not be removed from this device.`, err); }
  }

    try { return Array.from({ length: localStorage.length }, (_, i) => localStorage.key(i)).filter((k) => k && k.startsWith(prefix)); }

  // Everything on this device: no sign-in, one store in localStorage. Match states are the device copies themselves.
  function localBackend() {
    const read = () => ({ teams: [], players: [], matches: {}, templates: [], fixtures: [], sessions: [], ...readJson(LOCAL_DB_KEY) });
    const write = (db) => { if (!writeJson(LOCAL_DB_KEY, db)) throw new Error('no queda espacio en este dispositivo'); };
    const plain = (p) => ({ id: p.id, num: p.num, name: p.name, pos: p.pos, fullName: p.fullName || null, photo: p.photo || null });
    const plainFixture = ({ id, season, competition, round, weekend, home, opponent, kickoff, venue, matchId }) => ({ id, season, competition, round, weekend, home, opponent, kickoff, venue, matchId });
    const listFixtures = async (teamId) => read().fixtures.filter((f) => f.teamId === teamId).map(plainFixture).sort(byWeekend);
    const plainSession = ({ id, date, kind, matchId, marks, note }) => ({ id, date, kind, matchId, marks, note });
    return {
      needsLogin: false,
      listFixtures,
      async listTeams() { return read().teams; },
      async createTeam(fields) {
        const db = read();
        const created = { ...fields, id: newUuid() };
        db.teams.push(created);
        write(db);
        return created;
      },
      async updateTeam(id, fields) {
        const db = read();
        const found = db.teams.find((t) => t.id === id);
        if (!found) throw new Error('el equipo ya no existe');
        Object.assign(found, fields, { id });
        write(db);
        return found;
      },
      async listPlayers(teamId) { return read().players.filter((p) => p.teamId === teamId && p.active).map(plain).sort((a, b) => a.num - b.num); },
      async savePlayer(teamId, player) {

        return plain(row);
      },
      async retirePlayer(teamId, id) {
        const db = read();
        const row = db.players.find((p) => p.id === id && p.teamId === teamId);
        if (row) row.active = false;
        write(db);
      },
      async listMatches(teamId) { return Object.values(read().matches).filter((m) => m.teamId === teamId).map((m) => m.summary); },
      // States are the device copies; a match without one is skipped.
      async listMatchStates(teamId) {

      },
      // Re-importing a calendar updates the file's columns and keeps the kickoff, the venue and the match link.
      async saveFixtures(teamId, { season, competition, fixtures }) {
        const db = read();
        fixtures.forEach((f) => {
          let row = db.fixtures.find((x) => x.teamId === teamId && x.season === season && x.competition === competition && x.round === f.round);
          if (!row) { row = { id: newUuid(), teamId, season, competition, round: f.round, kickoff: null, venue: null, matchId: null }; db.fixtures.push(row); }

      },

      },
      async listSessions(teamId) { return read().sessions.filter((x) => x.teamId === teamId).map(plainSession).sort(byNewestSession); },
      // One session per team, day and kind: the first row keeps its id, as the cloud's attendance_keep_id trigger does.

        write(db);
      },
      async deleteTeam(id) {
        const db = read();
        db.teams = db.teams.filter((t) => t.id !== id);
        db.players = db.players.filter((p) => p.teamId !== id);
        db.fixtures = db.fixtures.filter((f) => f.teamId !== id);
        db.sessions = db.sessions.filter((x) => x.teamId !== id);
        Object.keys(db.matches).filter((k) => db.matches[k].teamId === id).forEach((k) => { delete db.matches[k]; });

      async saveTemplate(t) {

        return { ...row };
      },
      async deleteTemplate(id) {
        const db = read();
        db.templates = db.templates.filter((x) => x.id !== id);
        write(db);
      }
