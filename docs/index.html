  // Supabase: email + password accounts (invitation only), tables and policies in supabase/schema.sql.
  async function supabaseBackend(config) {
    // Read before the client consumes the link: an invitation or a password reset asks for a new password.
    const passwordLink = /[#&]type=(invite|recovery)(&|$)/.test(location.hash);
    if (!window.supabase) await loadScript(SUPABASE_JS_URL);
    const client = window.supabase.createClient(config.url, config.anonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    const check = (result) => { if (result.error) throw new Error(result.error.message); return result.data; };
    const toTeam = (r) => ({ id: r.id, club: r.club, name: r.name, brand: r.brand, brand2: r.brand2, brandInk: r.brand_ink, crest: r.crest, ratingWeights: r.rating_weights });
    const teamRow = (t) => ({ club: t.club, name: t.name, brand: t.brand, brand2: t.brand2, brand_ink: t.brandInk, crest: t.crest,
      ...(t.ratingWeights === undefined ? {} : { rating_weights: t.ratingWeights }) });
    const PLAYER_COLUMNS = 'id,num,name,pos,full_name,photo';
    // `name` is the short name shown on court; `fullName` is the one on the official card.
    const toPlayer = (r) => ({ id: r.id, num: r.num, name: r.name, pos: r.pos, fullName: r.full_name, photo: r.photo });
    const toFixture = (r) => ({ id: r.id, season: r.season, competition: r.competition, round: r.round, weekend: r.weekend, home: r.home, opponent: r.opponent, kickoff: r.kickoff, venue: r.venue, matchId: r.match_id });
    const toSession = (r) => ({ id: r.id, date: r.on_date, kind: r.kind, matchId: r.match_id, marks: r.marks || {}, note: r.note || '' });
    const listFixtures = async (teamId) => check(await client.from('fixtures').select(FIXTURE_COLUMNS).eq('team_id', teamId).order('weekend').order('round')).map(toFixture);
    const toSummary = (r) => ({ id: r.id, date: r.played_on || '', them: r.rival, venue: r.venue, status: r.status, scoreUs: r.score_us, scoreThem: r.score_them });
    return {
      needsLogin: true,
      passwordLink,
      listFixtures,
      async currentUser() { const { session } = check(await client.auth.getSession()); return session ? { email: session.user.email } : null; },
      async signIn(email, password) { check(await client.auth.signInWithPassword({ email, password })); },
      async signOut() { check(await client.auth.signOut()); },
      async sendPasswordReset(email) { check(await client.auth.resetPasswordForEmail(email, { redirectTo: `${location.origin}${location.pathname}` })); },
      async setPassword(password) { check(await client.auth.updateUser({ password })); },
      async listTeams() { return check(await client.from('teams').select('*').order('created_at')).map(toTeam); },
      async createTeam(t) {
        return toTeam(check(await client.rpc('create_team', { p_club: t.club, p_name: t.name, p_brand: t.brand, p_brand2: t.brand2, p_brand_ink: t.brandInk, p_crest: t.crest })));
      },
      async updateTeam(id, t) { return toTeam(check(await client.from('teams').update(teamRow(t)).eq('id', id).select().single())); },
      async listPlayers(teamId) { return check(await client.from('players').select(PLAYER_COLUMNS).eq('team_id', teamId).eq('active', true).order('num')).map(toPlayer); },
      async savePlayer(teamId, p) {
        const row = { team_id: teamId, num: p.num, name: p.name, pos: p.pos, full_name: p.fullName || null, photo: p.photo || null };
        const query = p.id ? client.from('players').update(row).eq('id', p.id) : client.from('players').insert(row);
        return toPlayer(check(await query.select(PLAYER_COLUMNS).single()));
      },
      async retirePlayer(teamId, id) { check(await client.from('players').update({ active: false }).eq('id', id).eq('team_id', teamId)); },
      async listMatches(teamId) {
        return check(await client.from('matches').select('id,played_on,rival,venue,status,score_us,score_them').eq('team_id', teamId)
          .order('played_on', { ascending: false, nullsFirst: false }).order('updated_at', { ascending: false })).map(toSummary);
      },
      async listMatchStates(teamId) {
        return check(await client.from('matches').select('id,played_on,rival,venue,status,score_us,score_them,state').eq('team_id', teamId)
          .order('played_on', { ascending: false, nullsFirst: false }).order('updated_at', { ascending: false })).filter((r) => r.state).map((r) => ({ ...toSummary(r), state: r.state }));
      },
      async loadMatch(id) {
        const row = check(await client.from('matches').select('state,updated_at').eq('id', id).maybeSingle());
        return row ? { state: row.state, version: row.updated_at } : null;
      },
      // { saved, version } or, when another device saved the match since `base.version`, { saved: false, version, state }
      // with the cloud's copy (the save_match function in schema.sql decides).
      async saveMatch(teamId, id, s, base = { version: null, editedAt: Date.now() }) {
        const m = matchSummary(id, s);
        const row = { played_on: m.date || null, rival: m.them, venue: m.venue, status: m.status, score_us: m.scoreUs, score_them: m.scoreThem, state: s };
        return check(await client.rpc('save_match', { p_id: id, p_team_id: teamId, p_base: base.version, p_edited_at: new Date(base.editedAt).toISOString(), p_row: row }));
      },
      async deleteMatch(id) { check(await client.from('matches').delete().eq('id', id)); },
      async listSessions(teamId) { return check(await client.from('attendance_sessions').select(SESSION_COLUMNS).eq('team_id', teamId).order('on_date', { ascending: false })).map(toSession); },
      // The unique key makes two devices on the same day one session; the attendance_keep_id trigger keeps the first id, and the row that comes back carries it.
      async saveSession(teamId, s) {
        const row = { id: s.id || newUuid(), team_id: teamId, on_date: s.date, kind: s.kind, match_id: s.matchId || null, marks: s.marks, note: s.note || null };
        return toSession(check(await client.from('attendance_sessions').upsert(row, { onConflict: SESSION_KEY }).select(SESSION_COLUMNS).single()));
      },
      async deleteSession(id) {
        if (!check(await client.from('attendance_sessions').delete().eq('id', id).select('id')).length) throw new Error(SESSION_GONE);
      },
      // The upsert writes only the file's columns, so a re-import keeps the kickoff, the venue and the match link.
      async saveFixtures(teamId, { season, competition, fixtures }) {
        const rows = fixtures.map((f) => ({ team_id: teamId, season, competition, round: f.round, weekend: f.weekend, home: f.home, opponent: f.opponent }));
        check(await client.from('fixtures').upsert(rows, { onConflict: FIXTURE_KEY }));
        return listFixtures(teamId);
      },
      async updateFixture(id, patch) {
        const row = Object.fromEntries(Object.entries(FIXTURE_COLUMN_OF).filter(([k]) => k in patch).map(([k, column]) => [column, patch[k]]));
        return toFixture(check(await client.from('fixtures').update(row).eq('id', id).select(FIXTURE_COLUMNS).single()));
      },
      // Row level security lets only the owner delete; anyone else deletes nothing, which is reported.
      async deleteTeam(id) {
        if (!check(await client.from('teams').delete().eq('id', id).select('id')).length) throw new Error('solo quien creó el equipo puede borrarlo');
      },
      // Rival templates belong to the signed-in coach (the table fills in user_id).
      async listTemplates() { return check(await client.from('rival_templates').select('id,name,players').order('name')); },
      async saveTemplate(t) {
        const row = { name: t.name, players: t.players };
        const query = t.id ? client.from('rival_templates').update(row).eq('id', t.id) : client.from('rival_templates').insert(row);
        return check(await query.select('id,name,players').single());
      },
      async deleteTemplate(id) { check(await client.from('rival_templates').delete().eq('id', id)); }
    };
  }

  // Reads refresh a device copy; without coverage that copy answers (the list shows it is not fresh).
  async function cachedRead(key, read) {
    try {
      const value = await read();
      writeJson(CACHE_KEY_PREFIX + key, value);
      return { value, offline: false };
    } catch (err) {
      const value = readJson(CACHE_KEY_PREFIX + key);
      if (value == null) throw err;
      console.warn(`Using the device copy of ${key}: ${cloudErrorText(err)}`);
      return { value, offline: true };
    }
  }
  const userKey = () => (home.user ? home.user.email : 'device');

  // ---- Rival templates (the coach's profile) ----
  const sameName = (a, b) => a.toLowerCase() === b.toLowerCase();
  const byTemplateName = (a, b) => a.name.localeCompare(b.name, 'es');
  const templateByName = (name) => home.templates.find((t) => sameName(t.name, name));
  const templatesKey = () => `templates:${userKey()}`;
  // What a template keeps of each rival: dorsal, name and position (both optional), in dorsal order.
  const templatePlayers = (list) => list.slice().sort((a, b) => a.num - b.num).map(({ num, name, pos }) => ({ num, name: name || '', pos: pos || null }));
  async function loadTemplates() {
    const { value, offline } = await cachedRead(templatesKey(), () => backend.listTemplates());
    home.templates = value;
    return offline;
  }
  async function storeTemplate(t) {
    const saved = await backend.saveTemplate(t);
    home.templates = [...home.templates.filter((x) => x.id !== saved.id), saved].sort(byTemplateName);
    writeJson(CACHE_KEY_PREFIX + templatesKey(), home.templates);
    return saved;
  }

  // ---- Match saving and upload ----
  function save() {
    if (!currentMatchId) return; // the sample match is never saved
    storeLocalMatch(currentMatchId, state, true);
    scheduleSync();
  }
  function scheduleSync() {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncMatches, SYNC_DELAY_MS);
  }
  // Uploads every match changed on this device; a failed one stays marked and goes on the next try. Runs one at a time,
  // so two uploads of one copy never race (the second would carry a version the first already replaced).
  let syncRun = Promise.resolve();
  function syncMatches() {
    clearTimeout(syncTimer);
    syncRun = syncRun.then(uploadDirtyMatches);
    return syncRun;
  }
  async function uploadDirtyMatches() {
    if (!backend) return;
    for (const m of localMatches().filter((x) => x.dirty)) {
      try {
        const result = await backend.saveMatch(m.teamId, m.id, m.state, { version: m.version ?? null, editedAt: m.savedAt });
        if (!result.saved) { adoptCloudMatch(m, result); continue; }
        const latest = localMatch(m.id);
        if (latest) writeJson(MATCH_KEY_PREFIX + m.id, { ...latest, version: result.version, dirty: latest.savedAt !== m.savedAt });
      } catch (err) {
        console.warn(`Match ${m.id} not uploaded yet: ${cloudErrorText(err)}`);
      }
    }
  }
  const CONFLICT_TEXT = 'Este partido se cambió en otro dispositivo: se ha cargado esa versión. Tu copia queda guardada en esta tablet.';
  // Another device saved the match after this copy was read: the cloud's copy wins, this one is set aside.
  function adoptCloudMatch(m, cloud) {
    writeJson(`${CONFLICT_KEY_PREFIX}${m.id}:${m.savedAt}`, m);
    writeJson(MATCH_KEY_PREFIX + m.id, { ...m, state: cloud.state, version: cloud.version, dirty: false, savedAt: Date.now() });
    console.warn(`Match ${m.id}: newer copy in the cloud, this device's copy kept under ${CONFLICT_KEY_PREFIX}`);
    if (m.id !== currentMatchId) return;
    state = restoreState(cloud.state);
    renderAll();
    hint(CONFLICT_TEXT);
  }
  window.addEventListener('online', syncMatches);

  // ---- Attendance: one session per team, day and kind; marks only for who was absent ----
  const ATTENDANCE = { P: 'Presente', F: 'Falta', J: 'Justificada', L: 'Lesionado', NC: 'No convocado' };
  const SESSION_KINDS = { TRAINING: 'ENTRENO', MATCH: 'PARTIDO' };
  const MARK_CODES = ['F', 'J', 'L'];
  const attendanceKey = (teamId) => ATTENDANCE_KEY_PREFIX + teamId;
  const sameSession = (a, b) => a.date === b.date && a.kind === b.kind;
  // The device copy of a team: its sessions, each with the dirty flag of the matches' copies.
  const localSessions = (teamId = team.id) => readJson(attendanceKey(teamId)) || [];
  function storeLocalSession(s, dirty) {
    const kept = localSessions().filter((x) => !sameSession(x, s));
    writeJson(attendanceKey(team.id), [...kept, { ...s, dirty: Boolean(dirty), savedAt: Date.now() }]);
  }
  // Sessions changed on this device and not uploaded yet replace (or add to) the backend's list.
  function withLocalSessions(list) {
    const dirty = localSessions().filter((x) => x.dirty);
    const kept = list.filter((s) => !dirty.some((x) => sameSession(x, s)));
    const pending = dirty.map(({ dirty: flag, savedAt, ...s }) => ({ ...s, pending: true }));
    return [...kept, ...pending].sort(byNewestSession);
  }
  const pendingSessions = () => storedKeys(ATTENDANCE_KEY_PREFIX).flatMap((key) => (readJson(key) || []).filter((x) => x.dirty));
  async function loadAttendance() {
    const teamId = team.id;
    const { value, offline } = await cachedRead(`attendance:${teamId}`, () => backend.listSessions(teamId));
    if (team.id === teamId) home.sessions = withLocalSessions(value);
    return { offline };
  }
  function scheduleAttendanceSync() {
    clearTimeout(attendanceSyncTimer);
    attendanceSyncTimer = setTimeout(syncAttendance, CONFIG.attendance.syncDelayMs);
  }
  // Uploads every session changed on this device and adopts the row that comes back: on a same-day conflict the
  // trigger keeps the first id. A session edited during the upload keeps the adopted id and stays marked.
  async function syncAttendance() {
    clearTimeout(attendanceSyncTimer);
    if (!backend) return;
    for (const key of storedKeys(ATTENDANCE_KEY_PREFIX)) {
      const teamId = key.slice(ATTENDANCE_KEY_PREFIX.length);
      for (const pending of (readJson(key) || []).filter((x) => x.dirty)) {
        try {
          const { dirty, savedAt, ...sent } = pending;
          const saved = await backend.saveSession(teamId, sent);
          const adopt = (x) => (!sameSession(x, pending) ? x : x.savedAt === savedAt ? { ...saved, dirty: false, savedAt } : { ...x, id: saved.id });
          const stored = (readJson(key) || []).map(adopt);
          writeJson(key, stored);
          const uploaded = stored.find((x) => sameSession(x, pending));
          if (team.id === teamId && home.sessions) home.sessions = home.sessions.map(({ pending: wasPending, ...x }) => (!sameSession(x, pending) ? { ...x, ...(wasPending && { pending: true }) } : { ...x, id: saved.id, ...(uploaded.dirty && { pending: true }) }));
          if (home.view === 'attendance') homeStatus(attendanceStatusText());
        } catch (err) {
          console.warn(`Attendance of ${pending.date} not uploaded yet: ${cloudErrorText(err)}`);
        }
      }
    }
  }
  window.addEventListener('online', syncAttendance);

  // P→F→J→L→P; a player not called up to a match goes NC→F→J→L→NC.
  function nextStatus(code, onMatchDay) {
    const at = MARK_CODES.indexOf(code);
    if (at < 0) return MARK_CODES[0];
    return at + 1 < MARK_CODES.length ? MARK_CODES[at + 1] : onMatchDay ? 'NC' : 'P';
  }
  // Pure: P and NC are the absence of a mark; a note stays with the player until another one replaces it.
  function setMark(session, playerId, code, note) {
    const { [playerId]: previous, ...marks } = session.marks;
    if (MARK_CODES.includes(code)) {
      const text = (note === undefined ? previous && previous.n : note) || '';
      marks[playerId] = text ? { s: code, n: text.slice(0, CONFIG.attendance.noteMax) } : { s: code };
    }
    return { ...session, marks };
  }
  // On a match day the squad of the match is present and cannot be changed; the others (everybody, without a match) are not called up unless marked.
  function sessionStatus(session, playerId, match) {
    const mark = session.marks[playerId];
    const marked = mark && MARK_CODES.includes(mark.s) ? mark.s : null;
    if (session.kind !== SESSION_KINDS.MATCH) return marked || 'P';
    if (!match) return marked || 'NC';
    return match.state.players.some((p) => p.id === playerId) ? 'P' : marked || 'NC';
  }

  // ---- Attendance rates: pct = presentes ÷ contadas; «No convocado» and CONFIG.attendance.excludeFromRate (Lesionado) are not counted ----
  const ABSENCE_LEADERS = 3;
  // Every session day of the team: the stored sessions, plus a derived «Partido» (convocados present) for each season match without a stored one.
  function attendanceDays(sessions, matches) {
    const matchOf = (s) => matches.find((m) => m.id === s.matchId) || matches.find((m) => m.date === s.date) || null;
    const stored = sessions.map((session) => ({ session, match: session.kind === SESSION_KINDS.MATCH ? matchOf(session) : null }));
    const covered = new Set(stored.map((day) => day.match));
    const derived = matches.filter((m) => SEASON_STATUSES.includes(m.status) && !covered.has(m))
      .map((m) => ({ session: { date: m.date, kind: SESSION_KINDS.MATCH, matchId: m.id, marks: {} }, match: m }));
    return [...stored, ...derived];
  }
  function attendanceRows(sessions, matches, roster) {
    const days = attendanceDays(sessions, matches);
    return roster.map((player) => {
      const row = { player, P: 0, F: 0, J: 0, L: 0, counted: 0, pct: null, byKind: {} };
      Object.values(SESSION_KINDS).forEach((kind) => { row.byKind[kind] = { P: 0, counted: 0, pct: null }; });
      days.forEach(({ session, match }) => {
        const code = sessionStatus(session, player.id, match);
        if (code === 'NC') return;
        row[code] += 1;
        if (CONFIG.attendance.excludeFromRate.includes(code)) return;
        const kind = row.byKind[session.kind];
        row.counted += 1; kind.counted += 1;
        if (code === 'P') kind.P += 1;
      });
      row.pct = pct(row.P, row.counted);
      Object.values(row.byKind).forEach((k) => { k.pct = pct(k.P, k.counted); });
      return row;
    });
  }

  // ---- Colour ----
  // Rating bands from best to worst: the --rating-<band> and --rating-ink-<band> tokens.
  const RATING_BANDS = ['top', 'good', 'mid', 'low', 'bad'];
  const LINEAR_RGB_KNEE = 0.03928, LINEAR_RGB_SLOPE = 12.92, LINEAR_RGB_OFFSET = 0.055, LINEAR_RGB_SCALE = 1.055, LINEAR_RGB_GAMMA = 2.4;
  const LUMINANCE_WEIGHTS = [0.2126, 0.7152, 0.0722];
  const CONTRAST_FLARE = 0.05;
  const SHORT_HEX = /^#[\da-f]{3}$/i;
  // WCAG relative luminance of «#rrggbb» (or «#rgb»), from 0 (black) to 1 (white).
  function relLuminance(hex) {
    const linear = (c) => (c <= LINEAR_RGB_KNEE ? c / LINEAR_RGB_SLOPE : ((c + LINEAR_RGB_OFFSET) / LINEAR_RGB_SCALE) ** LINEAR_RGB_GAMMA);
    return hexToRgb(SHORT_HEX.test(hex) ? hex.replace(/[\da-f]/gi, '$&$&') : hex).reduce((sum, c, i) => sum + LUMINANCE_WEIGHTS[i] * linear(c / 255), 0);
  }
  // WCAG contrast ratio of two «#rrggbb» colours, from 1 to 21, whichever order they come in.
  function contrastRatio(a, b) {
    const [light, dark] = [relLuminance(a), relLuminance(b)].sort((x, y) => y - x);
    return (light + CONTRAST_FLARE) / (dark + CONTRAST_FLARE);
  }

  // ---- Team look ----
  const rgbTriplet = (hex) => hexToRgb(hex).join(', ');
  // Text colour that reads on the brand colour.
  function inkFor(hex) {
    const [r, g, b] = hexToRgb(hex).map((c) => c / 255);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b > LIGHT_BRAND_LUMINANCE ? INK_DARK : INK_LIGHT;
  }
  // The uploaded crest, or the team's initials on its colours.
  const initialsOf = (name) => name.split(/\s+/).filter(Boolean).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
  function crestSrc(t) {
    if (t.crest && IMAGE_DATA_URL.test(t.crest)) return t.crest;
    const initials = initialsOf(t.name);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><circle cx="48" cy="48" r="45" fill="${t.brand}" stroke="${t.brand2}" stroke-width="6"/>`
      + `<text x="48" y="61" font-family="system-ui,sans-serif" font-weight="800" font-size="36" text-anchor="middle" fill="${t.brandInk}">${esc(initials)}</text></svg>`;
    return `data:image/svg+xml,${encodeURIComponent(svg)}`;
  }
  function applyTeam(t) {
    team = t;
    const root = document.documentElement.style;
    root.setProperty('--brand', t.brand);
    root.setProperty('--brand-rgb', rgbTriplet(t.brand));
    root.setProperty('--brand-2-rgb', rgbTriplet(t.brand2));
    root.setProperty('--brand-ink', t.brandInk);
    PDF_RGB.brand = hexToRgb(t.brand);
    PDF_RGB.brand2 = hexToRgb(t.brand2);
    $('bar-crest').src = crestSrc(t);
    document.title = `${t.name} · HBStats`;
  }
  const IMAGE_FILE_TYPE = /^image\/(png|jpeg|webp)$/;
  const IMAGE_QUALITY = 0.85, JPEG_BACKDROP = '#fff';
  // A square crop of the uploaded image, small enough to keep with the team (and offline).
  async function imageFromFile(file, sizePx, type) {
    if (!IMAGE_FILE_TYPE.test(file.type)) throw new Error('tiene que ser PNG, JPG o WebP');
    const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const side = Math.min(bitmap.width, bitmap.height);
    const canvas = document.createElement('canvas');
    canvas.width = sizePx;
    canvas.height = sizePx;
    const context = canvas.getContext('2d');
    if (type === 'image/jpeg') { context.fillStyle = JPEG_BACKDROP; context.fillRect(0, 0, sizePx, sizePx); }
    context.drawImage(bitmap, (bitmap.width - side) / 2, (bitmap.height - side) / 2, side, side, 0, 0, sizePx, sizePx);
    bitmap.close();
    return canvas.toDataURL(type, IMAGE_QUALITY);
  }
  const crestFromFile = (file) => imageFromFile(file, CREST_SIZE_PX, 'image/png');
  async function photoFromFile(file) {
    const photo = await imageFromFile(file, CONFIG.photoSizePx, 'image/jpeg');
    if (photo.length > MAX_PHOTO_LENGTH) throw new Error('la foto es demasiado grande');
    return photo;
  }

  // ---- Home screen ----
  const homeStatus = (text) => sheetStatus('home-status', text);
  const statusHtml = (text = '') => `<p class="note home-status" id="home-status" role="status" aria-live="polite">${esc(text)}</p>`;
  // Destructive buttons ask once more: the first tap arms them ("¿Seguro?"), the second acts.

  function confirmTap(id) {
    if (home.armed === id) { home.armed = null; return true; }
    home.armed = id;
    renderHome();
    return false;
  }
  const NAV_LABELS = { teams: 'Mis equipos', team: 'Equipo', matches: 'Partidos', liveMatch: 'Volver al partido', halftime: 'Descanso', final: 'Final', cancel: 'Cancelar' };
  const backButtonHtml = (label, attrs) => `<button class="btn back-nav press" type="button" data-nav-leading ${attrs}>‹ ${esc(label)}</button>`;
  const cancelButtonHtml = (attrs, armId) => (armId ? armedButton(armId, NAV_LABELS.cancel, `data-nav-leading ${attrs}`)
    : `<button class="btn press" type="button" data-nav-leading ${attrs}>${NAV_LABELS.cancel}</button>`);
  // Leading: the one way out. Trailing: the page's actions, the primary last.
  const pageBarHtml = ({ leading = '', title = '', actions = '', heading = 'h2' } = {}) => `<div class="page-bar">${leading}${title ? `<${heading} class="page-title">${esc(title)}</${heading}>` : ''}<div class="page-actions">${actions}</div></div>`;
  const dateText = (iso) => (iso ? new Date(`${iso}T12:00:00`).toLocaleDateString('es-ES') : '');
  const shortDateText = (iso) => (iso ? new Date(`${iso}T12:00:00`).toLocaleDateString('es-ES', { day: 'numeric', month: 'numeric' }) : '');

  function loginHtml() {
    return `<form class="auth-card glass" data-form="login">
      <div class="auth-brand"><span class="app-mark" aria-hidden="true">HB</span><div><h1>HBStats</h1><p class="note">Estadísticas de balonmano en directo</p></div></div>
      <label class="field">Email<input class="in" type="email" name="email" id="login-email" autocomplete="username" required></label>

  function passwordHtml() {

    const head = change ? pageBarHtml({

      <label class="field">Contraseña nueva<input class="in" type="password" name="password" id="new-password" autocomplete="new-password" minlength="${MIN_PASSWORD_LENGTH}" required></label>
      <label class="field">Repítela<input class="in" type="password" name="repeat" id="new-password-repeat" autocomplete="new-password" minlength="${MIN_PASSWORD_LENGTH}" required></label>
      ${change ? '' : '<div class="row-actions"><button class="btn primary press" type="submit">Guardar contraseña</button></div>'}
      ${statusHtml()}
    </form>`;
  }
  const TEAM_NEW_FORM_ID = 'team-new-form', PASSWORD_FORM_ID = 'password-form';
  function teamFormHtml(t, creating) {
    const crest = home.crestDraft === undefined ? t.crest : home.crestDraft;
    const colour = (label, key) => `<label>${label}<input class="in colour" type="color" name="${key}" id="team-${key}" value="${t[key]}"></label>`;
    return `<form class="team-form" data-form="${creating ? 'team-new' : 'team'}"${creating ? ` id="${TEAM_NEW_FORM_ID}"` : ''}>
      <div class="crest-pick"><img class="crest-preview" id="crest-preview" src="${esc(crestSrc({ ...t, crest }))}" alt="Escudo">
        <div class="row-actions"><button class="btn press" type="button" data-crest-pick>Subir escudo</button>${crest ? '<button class="btn press" type="button" data-crest-clear>Quitar</button>' : ''}</div>

    const withState = (m) => ({ ...matchSummary(m.id, m.state), state: m.state });

    if (team.id !== teamId) return null;

    const all = withLocalChanges(list, (m) => ({ state: m.state })).filter((m) => m.state && !m.state.sample);

  // ---- Calendar: the federation's fixtures, and the matches played against them ----

  const MAX_FIXTURE_ROUND = 60, MAX_OPPONENT_LENGTH = 60, MAX_COMPETITION_LENGTH = 120;

  // Validates an imported calendar file; returns the season and its rounds or throws an Error explaining what is wrong.

  // ---- Team dashboard: the season of the team by match, by attack type, by goalkeeper and by player ----
  const STATS_DEFAULT_SORT = { key: 'rating', dir: -1 };

  // One finished or live match of the season as the dashboard reads it.

    const { events } = m.state;

      const c = countGroups(gkShots(id, events));

      id: m.id, date: m.date, them: m.them, result: matchResult(m), scoreUs: m.scoreUs, scoreThem: m.scoreThem, ...matchFigures(m.state),

  // Who lost the ball, by type of turnover; players of the roster with none do not appear.
  function turnoversByPlayer(matches, roster) {
    const lost = matches.flatMap((m) => m.state.events).filter((e) => e.kind === 'TURNOVER');
    return roster.map((player) => {

  }
  // Minutes and +/− stay null when no match of the player has them.
  function seasonPlayerTable(matches, roster) {
    return roster.map((player) => {
      const season = playerSeason(matches, player), t = season.totals, known = (field) => season.rows.some((r) => r[field] != null);
      return {
        player, played: season.rows.length, seconds: known('seconds') ? t.seconds : null, plusMinus: known('plusMinus') ? t.plusMinus : null,
        rating: season.rating, goals: t.goals ?? 0, shots: t.shots ?? 0, turnovers: t.turnovers ?? 0

  }
  const STATS_SORT_VALUES = { player: (r) => r.player.num, played: (r) => r.played, seconds: (r) => r.seconds, plusMinus: (r) => r.plusMinus, rating: (r) => r.rating, goals: (r) => r.goals, turnovers: (r) => r.turnovers };
  // Unknown values go last whichever way the column is sorted; ties follow the dorsal.

      if (x == null || y == null) return (x == null) - (y == null) || a.player.num - b.player.num;

    });
  }
  function nextStatsSort(key) {
    const sort = home.statsSort || STATS_DEFAULT_SORT;

  }
  const legendHtml = (items) => `<ul class="chart-legend">${items.map(({ label, token }) => `<li><i style="background:var(--${token})"></i>${esc(label)}</li>`).join('')}</ul>`;
  // A trend needs CONFIG.stats.minTrendMatches matches; with fewer the stat tiles of the card are the whole story.
  const trendBlockHtml = (rows, series) => (rows.length < CONFIG.stats.minTrendMatches ? '' : `<figure class="trend">${legendHtml(series)}${trendSvg(rows, series, 'line')}</figure>`);
  const barsBlockHtml = (rows, series) => `<figure class="trend">${series.length > 1 ? legendHtml(series) : ''}${trendSvg(rows, series, 'bars')}</figure>`;
  const statsTilesHtml = (tiles) => `<div class="stat-tiles">${tiles.map((t) => statTileHtml(...t)).join('')}</div>`;
  const rateValue = (value) => (value == null ? NaN : value / PERCENT);

  // ---- Rating tuning: the coach moves the weights and sees the squad's ratings change before saving ----

  };
  const tuneDirty = () => { const saved = ratingKnobValues(); return RATING_KNOBS.some((k) => home.weightsDraft[k.key] !== saved[k.key]); };
  // Only the knobs that differ from the defaults are saved; none changed means the team has no weights of its own.
  const tuneChangedKnobs = () => Object.fromEntries(RATING_KNOBS.filter((k) => home.weightsDraft[k.key] !== RATING_KNOB_DEFAULTS[k.key]).map((k) => [k.key, home.weightsDraft[k.key]]));
  // Every match's ratings with the team's saved weights are worked out once and live as long as the season array.
  function savedRatingsFor(matches) {
    if (!home.ratingCache || home.ratingCache.season !== matches) home.ratingCache = { season: matches, byMatch: new Map() };
    const cache = home.ratingCache.byMatch;
    return (m) => { if (!cache.has(m.id)) cache.set(m.id, matchRatings(m.state)); return cache.get(m.id); };
  }
  // Each rostered player's season rating with the team's saved weights (`current`) and with `weights` (`next`), plus
  // the rating of the latest match with `weights`. A match is rated once per weights for the whole squad.
  function rosterRatingPreview(matches, roster, weights) {
    const savedOf = savedRatingsFor(matches), nextByMatch = new Map(matches.map((m) => [m.id, matchRatings(m.state, m.state.players, weights)]));
    return roster.map((player) => {
      const played = matches.filter((m) => m.state.players.some((p) => p.id === player.id)).map((m) => ({

      const current = seasonOf('current'), next = seasonOf('next');

    });
  }
  const tuneChipHtml = (value) => (value == null ? '–' : ratingChipHtml(value));
  function tuneDeltaHtml(delta) {

  async function loadLatestMatch(id) {

    try {
      const remote = await backend.loadMatch(id);
      if (!remote) throw new Error('el partido ya no existe');
      return { state: remote.state, dirty: false, version: remote.version };

    }

  const BACK_GUARD_STATE = { hbstatsGuard: true };

    if (leading) {

      if (!atRootScreen()) armBackGuard();

  async function importTemplateFile(file) {
    let parsed;
    try { parsed = parseRoster(await file.text(), 'them', MAX_RIVAL_ROSTER); }
    catch (err) { homeStatus(`No se pudo cargar: ${err.message}.`); return; }
    const same = templateByName(parsed.team);
    home.template = { id: same ? same.id : null, name: same ? same.name : parsed.team, players: parsed.players };
    ui.rivalNewPos = null;
    showHomeView('template');
    homeStatus(same ? `Al guardar sustituirá a tu plantilla «${same.name}».` : 'Revisa la plantilla y pulsa «Guardar».');
  }

  function openNewTeam() {
    home.draft = { ...DEFAULT_TEAM };
    home.crestDraft = undefined;
    showHomeView('team-new');
  }
  // Removes the team and everything of it kept on this tablet, then opens another team (or asks for a new one).
  async function deleteTeam() {
    const gone = team;
    try { await backend.deleteTeam(gone.id); }
    catch (err) { homeStatus(`No se pudo borrar: ${cloudErrorText(err)}.`); return; }
    localMatches().filter((m) => m.teamId === gone.id).forEach((m) => removeKey(MATCH_KEY_PREFIX + m.id));
    [`players:${gone.id}`, `matches:${gone.id}`, `fixtures:${gone.id}`, `attendance:${gone.id}`].forEach((key) => removeKey(CACHE_KEY_PREFIX + key));
    removeKey(SQUAD_KEY_PREFIX + gone.id);
    removeKey(attendanceKey(gone.id));
    home.teams = home.teams.filter((t) => t.id !== gone.id);
    writeJson(CACHE_KEY_PREFIX + `teams:${userKey()}`, home.teams);
    applyTeam(DEFAULT_TEAM);
    if (home.teams.length) { await showProfile(); homeStatus(`Equipo «${gone.name}» borrado.`); return; }
    openNewTeam();
  }

  // ---- Sign-in ----
  async function signIn(form) {
    const data = new FormData(form);
    homeStatus('Entrando…');
    try {
      await backend.signIn(String(data.get('email')).trim(), String(data.get('password')));
      home.user = await backend.currentUser();
      await loadTeams();
    } catch (err) {
      homeStatus(`No se pudo entrar: ${cloudErrorText(err)}.`);
    }
  }
  async function sendPasswordReset() {
    const email = $('login-email').value.trim();
    if (!email) { homeStatus('Escribe arriba tu email y vuelve a pulsar.'); return; }
    try {
      await backend.sendPasswordReset(email);
      homeStatus('Te hemos enviado un email con un enlace para elegir una contraseña nueva.');
    } catch (err) {
      homeStatus(`No se pudo enviar: ${cloudErrorText(err)}.`);
    }
  }
  async function setPassword(form) {
    const data = new FormData(form);
    const password = String(data.get('password'));
    if (password.length < MIN_PASSWORD_LENGTH) { homeStatus(`La contraseña necesita al menos ${MIN_PASSWORD_LENGTH} caracteres.`); return; }
    if (password !== String(data.get('repeat'))) { homeStatus('Las dos contraseñas no coinciden.'); return; }
    try {
      await backend.setPassword(password);
      if (home.passwordChange) { await showProfile(); homeStatus('Contraseña cambiada.'); return; }
      history.replaceState(null, '', location.pathname);
      await loadTeams();
    } catch (err) {
      homeStatus(`No se pudo guardar: ${cloudErrorText(err)}.`);
    }
  }
  // Signing out leaves nothing of the team on the tablet, so it waits until every match is uploaded.
  async function signOut() {
    await Promise.all([syncMatches(), syncAttendance()]);
    if (localMatches().some((m) => m.dirty)) { homeStatus('Hay partidos sin subir: conéctate a internet antes de salir.'); return; }
    if (pendingSessions().length) { homeStatus('Hay asistencia sin subir: conéctate a internet antes de salir.'); return; }
    try { await backend.signOut(); }
    catch (err) { homeStatus(`No se pudo salir: ${cloudErrorText(err)}.`); return; }
    [...storedKeys(MATCH_KEY_PREFIX), ...storedKeys(ATTENDANCE_KEY_PREFIX), ...storedKeys(CACHE_KEY_PREFIX), ...storedKeys(SQUAD_KEY_PREFIX), CURRENT_MATCH_KEY].forEach(removeKey);
    Object.assign(home, { user: null, teams: [], roster: [], matches: [], sessions: null, stateMatches: [], templates: [] });
    applyTeam(DEFAULT_TEAM);
    showHomeView('login');
  }

  // ---- Home wiring ----
  $('home').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const form = ev.target;
    const kind = form.dataset.form;
    if (kind === 'login') signIn(form);
    else if (kind === 'password') setPassword(form);
    else if (kind === 'team-new') submitTeam(form, true);
    else if (kind === 'team') submitTeam(form, false);
  });
  $('home').addEventListener('click', (ev) => {
    const rowLink = ev.target.closest('[data-player-match]');
    if (rowLink) { showPlayerMatch(rowLink.dataset.playerMatch); return; }
    const b = ev.target.closest('button');
    if (!b || b.type === 'submit') return;
    if (home.view === 'rating-tune' && !b.hasAttribute('data-tune') && tuneDirty() && !confirmTap(TUNE_LEAVE_ARM)) return;
    const armedBefore = home.armed;
    if (b.dataset.restartMatch) { if (confirmTap(`restart-${b.dataset.restartMatch}`)) restartMatch(b.dataset.restartMatch); return; }
    if (b.dataset.deleteMatch) { if (confirmTap(`delete-${b.dataset.deleteMatch}`)) deleteMatch(b.dataset.deleteMatch); return; }
    if (b.dataset.teamDel) { if (confirmTap(`retire-${b.dataset.teamDel}`)) retireTeamPlayer(rosterPlayer(b.dataset.teamDel)); return; }
    if (b.hasAttribute('data-delete-team')) { if (confirmTap('delete-team')) deleteTeam(); return; }
    if (b.dataset.templateDel) { if (confirmTap(`template-${b.dataset.templateDel}`)) deleteTemplate(b.dataset.templateDel); return; }
    if (b.hasAttribute('data-att-delete')) { if (confirmTap('att-delete')) deleteAttendanceSession(); return; }
    if (b.hasAttribute('data-legacy-drop')) { if (confirmTap('legacy-drop')) { const l = legacyMatch(); if (l) removeKey(l.key); renderHome(); } return; }
    if (armedBefore) { home.armed = null; renderHome(); }
    if (b.hasAttribute('data-retry')) { startHome(); return; }
    if (b.hasAttribute('data-forgot')) { sendPasswordReset(); return; }
    if (b.hasAttribute('data-sign-out')) { signOut(); return; }
    if (b.dataset.att) { tapAttendance(b.dataset.att); return; }
    if (b.dataset.attKind) { openAttendanceDay(home.attendanceDate, b.dataset.attKind); return; }
    if (b.dataset.attNote) { home.attendanceNoteFor = b.dataset.attNote; renderHome(); document.querySelector(`[data-att-note-input="${b.dataset.attNote}"]`).focus(); return; }
    if (b.hasAttribute('data-att-note-save')) { home.attendanceNoteFor = null; renderHome(); return; }
    if (b.dataset.homeView === 'attendance') { showAttendance(); return; }
    if (b.dataset.homeView === 'matches') { showMatches(); return; }
    if (b.dataset.homeView === 'stats') { showStats(); return; }
    if (b.dataset.sort) { home.statsSort = nextStatsSort(b.dataset.sort); renderHome(); return; }
    if (b.dataset.homeView === 'team') { home.crestDraft = undefined; showTeamPage(); return; }
    if (b.dataset.player) { showPlayer(b.dataset.player); return; }
    if (b.hasAttribute('data-player-back')) { showPlayer(home.playerId); return; }
    if (b.dataset.playerMatchOpen) { openMatchForPlayer(b.dataset.playerMatchOpen, home.playerId); return; }
    if (b.hasAttribute('data-player-edit')) { toggleEdit(); return; }
    if (b.dataset.playerPos) { editDraft({ pos: b.dataset.playerPos.split(':')[1] }); return; }
    if (b.hasAttribute('data-player-photo')) { $('photo-file').click(); return; }
    if (b.hasAttribute('data-player-photo-clear')) { editDraft({ photo: null }); return; }
    if (b.hasAttribute('data-player-save')) { savePlayerCard(); return; }
    if (b.dataset.leader) { home.leaderMetric = b.dataset.leader; renderHome(); return; }
    if (b.dataset.tune === 'save') { saveRatingWeights(); return; }
    if (b.dataset.tune === 'reset') { home.weightsDraft = { ...RATING_KNOB_DEFAULTS }; renderHome(); return; }
    if (b.hasAttribute('data-rating-tune')) { showRatingTune(); return; }
    if (b.dataset.homeView === 'profile') { showProfile(); return; }
    if (b.dataset.homeView) { home.crestDraft = undefined; showHomeView(b.dataset.homeView); return; }
    if (b.hasAttribute('data-new-match')) { openSquad({ fixtureId: home.view === 'team' ? nextOpenFixtureId() : null }); return; }
    if (b.dataset.fixtureEdit) { home.fixtureEdit = { id: b.dataset.fixtureEdit, at: b.dataset.fixtureAt }; renderHome(); $('fx-date').focus(); return; }
    if (b.dataset.fixtureSave) { saveFixtureEdit(b.dataset.fixtureSave); return; }
    if (b.hasAttribute('data-fixture-cancel')) { home.fixtureEdit = null; renderHome(); return; }
    if (b.hasAttribute('data-new-team')) { openNewTeam(); return; }
    if (b.hasAttribute('data-cancel-team')) { showProfile(); return; }
    if (b.dataset.openTeam) { const t = home.teams.find((x) => x.id === b.dataset.openTeam); if (t) selectTeam(t); return; }
    if (b.hasAttribute('data-change-password')) { home.passwordChange = true; showHomeView('password'); return; }
    if (b.hasAttribute('data-template-new')) { editTemplate(null); return; }
    if (b.dataset.templateEdit) { editTemplate(home.templates.find((t) => t.id === b.dataset.templateEdit)); return; }
    if (b.dataset.templateExport) { const t = home.templates.find((x) => x.id === b.dataset.templateExport); exportRoster(t.name, t.players, 'home-status'); return; }
    if (b.hasAttribute('data-template-store')) { storeTemplateDraft(); return; }
    if (b.hasAttribute('data-tpl-add')) { addDraftRivals(); return; }
    if (b.dataset.tplNewPos) { pickRivalNewPos(b.dataset.tplNewPos.split(':')[1], 'tpl'); return; }
    if (b.dataset.tplPos) { const [id, pos] = b.dataset.tplPos.split(':'); const r = draftRival(id); editDraftRival(r, { pos: r.pos === pos ? null : pos }); return; }
    if (b.dataset.tplDel) { home.template.players = home.template.players.filter((r) => r.id !== b.dataset.tplDel); renderHome(); return; }
    if (b.hasAttribute('data-sample')) { openSample(); return; }
    if (b.dataset.openMatch) { openMatch(b.dataset.openMatch); return; }
    if (b.hasAttribute('data-legacy-import')) { importLegacyMatch(); return; }
    if (b.dataset.squad) { const id = b.dataset.squad; if (!home.squad.delete(id)) home.squad.add(id); renderHome(); return; }
    if (b.hasAttribute('data-squad-all')) { home.squad = new Set(home.roster.slice().sort(byPosition).slice(0, MAX_ROSTER).map((p) => p.id)); renderHome(); return; }
    if (b.hasAttribute('data-squad-none')) { home.squad = new Set(); renderHome(); return; }
    if (b.hasAttribute('data-squad-next')) { createMatch(); return; }
    if (b.hasAttribute('data-crest-pick')) { $('crest-file').click(); return; }
    if (b.hasAttribute('data-crest-clear')) { home.crestDraft = null; $('crest-preview').src = crestSrc({ ...(home.view === 'team-new' ? home.draft : team), crest: null }); b.remove(); return; }
    if (b.hasAttribute('data-team-add')) { addTeamPlayer(); return; }
    if (b.dataset.teamPos) { const [id, pos] = b.dataset.teamPos.split(':'); saveTeamPlayer(rosterPlayer(id), { pos }); return; }
    if (b.hasAttribute('data-team-export')) { exportRoster(team.name, home.roster, 'home-status'); return; }
    if (b.dataset.rosterImport) { ui.rosterSide = b.dataset.rosterImport; $('roster-file').click(); return; }
    if (b.hasAttribute('data-calendar-import')) { ui.rosterSide = CALENDAR_FILE_SIDE; $('roster-file').click(); }
  });
  $('home').addEventListener('change', (ev) => {
    const el = ev.target;
    if (el.id === 'tpl-name') { home.template.name = el.value; return; }
    if (el.dataset.knob) { homeStatus(Number.isFinite(parseKnobText(el.value)) || el.type === 'range' ? '' : KNOB_NUMBER_HINT); setKnobControl(el, home.weightsDraft[el.dataset.knob]); return; }
    if (el.id === 'att-date') { openAttendanceDay(el.value); return; }
    if (el.dataset.tplNum) { editDraftRival(draftRival(el.dataset.tplNum), { num: Number(el.value) }); return; }
    if (el.dataset.tplName) { editDraftRival(draftRival(el.dataset.tplName), { name: el.value.trim().slice(0, MAX_NAME_LENGTH) }); return; }
    if (el.dataset.teamNum) { saveTeamPlayer(rosterPlayer(el.dataset.teamNum), { num: Number(el.value) }); return; }
    if (el.dataset.teamName) saveTeamPlayer(rosterPlayer(el.dataset.teamName), { name: el.value.trim().slice(0, MAX_NAME_LENGTH) });
  });
  // A note is kept as it is typed, so no tap can lose it.
  $('home').addEventListener('input', (ev) => {
    if (ev.target.dataset.attNoteInput) saveAttendanceNote(ev.target.dataset.attNoteInput, ev.target.value);
    if (ev.target.dataset.knob) tuneKnob(ev.target);
  });
  $('home').addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ['tpl-dorsals', 'tpl-new-name'].includes(ev.target.id)) addDraftRivals(); });
  $('crest-file').addEventListener('change', (ev) => {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (file) pickCrest(file);
  });

  $('photo-file').addEventListener('change', (ev) => {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (file) pickPhoto(file);
  });

  // ===================== Boot =====================
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
  initTheme();
  $('court-floor').innerHTML = courtFloorSvg('court-clip');
  $('goal-net').innerHTML = GOAL_NET_SVG;
  $('goal-frame').innerHTML = GOAL_FRAME_SVG;
  applyTeam(DEFAULT_TEAM);
  renderAll();
  if (DEMO) openDemo();
  else startHome();
  setInterval(tick, CONFIG.tickMs);
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((err) => console.error('Offline mode unavailable', err));
  });
}
</script>
</body>
</html>
